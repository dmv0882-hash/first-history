क्या आपका उस तरीके पर अमल करने का इरादा था?","gu":"શું તમે પોતાને મારી નાખવાની રીત નક્કી કરવાનું શરૂ કર્યું છે કે રીત નક્કી કરી લીધી છે? શું તમારો એ રીત પ્રમાણે કરવાનો ઇરાદો હતો?"}},{"id":"cssrs_6","text":{"en":"Have you ever done anything, started to do anything, or prepared to do anything to end your life?","hi":null,"gu":null},"follow_up":{"en":"If YES, ask: Was this within the past 3 months?","hi":null,"gu":null},"simple":{"en":"Have you ever done, started, or prepared anything to end your life?","hi":"क्या आपने कभी अपनी जान लेने के लिए कुछ किया, शुरू किया या तैयारी की?","gu":"શું તમે ક્યારેય પોતાનો જીવ લેવા કંઈ કર્યું, શરૂ કર્યું કે તૈયારી કરી?"}}]},{"id":"pcl5","name":"PCL-5","holder":"US Department of Veterans Affairs, National Center for PTSD","credit_line":"PCL-5, VA National Center for PTSD. Weathers et al. (2013).","licence":{"quote":"in the public domain and not copyrighted","url":"https://www.ptsd.va.gov/professional/assessment/adult-sr/ptsd-checklist.asp"},"scoring":{"method":"sum twenty 0-4 responses; 0-80; 31-33 is a suggested initial screening cut-off dependent on setting; clinical interview required","range":[0,80],"bands":[],"initial_screen_cutoff_range":[31,33],"source_url":"https://www.ptsd.va.gov/professional/assessment/adult-sr/ptsd-checklist.asp"},"danger_items":[],"offer_when":{"text":"Offer only after a frightening or highly stressful event has been reported and current symptoms are being explored.","source_url":"https://www.ptsd.va.gov/professional/assessment/adult-sr/ptsd-checklist.asp"},"offer_at":[{"flow":"gap.ptsd","question":"screen1","answer":"yes"},{"flow":"gap.acute-stress","question":"screen1","answer":"yes"}],"source_url":"https://www.ptsd.va.gov/professional/assessment/documents/pcl5_standard_form.pdf","translation":{"hi":{"status":"ours","notice":"Our translation, not validated; independent back-translation pending"},"gu":{"status":"ours","notice":"Our translation, not validated; independent back-translation pending"}},"timeframe_stem":{"en":"In the past month, how much were you bothered by:","hi":"पिछले एक महीने में, इनमें से हर बात से आपको कितनी परेशानी हुई?","gu":"છેલ્લા એક મહિનામાં, નીચેની દરેક બાબતથી તમને કેટલી તકલીફ થઈ?"},"response_options":[{"code":0,"text":{"en":"Not at all","hi":"बिल्कुल नहीं","gu":"જરા પણ નહીં"}},{"code":1,"text":{"en":"A little bit","hi":"थोड़ी सी","gu":"થોડીક"}},{"code":2,"text":{"en":"Moderately","hi":"कुछ हद तक","gu":"અમુક અંશે"}},{"code":3,"text":{"en":"Quite a bit","hi":"काफ़ी ज़्यादा","gu":"ઘણી"}},{"code":4,"text":{"en":"Extremely","hi":"बहुत ज़्यादा","gu":"ખૂબ જ વધારે"}}],"items":[{"id":"pcl5_1","text":{"en":"Repeated, disturbing, and unwanted memories of the stressful experience?","hi":"उस तनावपूर्ण घटना की यादें बार-बार आना, जो परेशान करती हैं और जिन्हें आप नहीं चाहते?","gu":"તે તણાવભરી ઘટનાની ન ગમતી અને પરેશાન કરતી યાદો વારંવાર આવવી?"},"simple":{"en":"Have unwanted memories of the upsetting event come back again and again and troubled you?","hi":"क्या उस परेशान करने वाली घटना की अनचाही यादें बार-बार आकर आपको परेशान करती हैं?","gu":"શું એ હેરાન કરનારી ઘટનાની યાદો તમારી ઇચ્છા વગર વારંવાર આવીને તમને પરેશાન કરે છે?"}},{"id":"pcl5_2","text":{"en":"Repeated, disturbing dreams of the stressful experience?","hi":"उस तनावपूर्ण घटना के बारे में बार-बार परेशान करने वाले सपने आना?","gu":"તે તણાવભરી ઘટના વિશે પરેશાન કરનારા સપનાં વારંવાર આવવાં?"},"simple":{"en":"Have upsetting dreams about the event come back again and again?","hi":"क्या उस परेशान करने वाली घटना के बुरे सपने बार-बार आए?","gu":"શું એ પરેશાન કરનારી ઘટનાનાં ખરાબ સપનાં વારંવાર આવ્યાં?"}},{"id":"pcl5_3","text":{"en":"Suddenly feeling or acting as if the stressful experience were actually happening again (as if you were actually back there reliving it)?","hi":"अचानक ऐसा लगना या व्यवहार करना जैसे वह तनावपूर्ण घटना फिर से हो रही है, मानो आप उसे फिर से जी रहे हों?","gu":"અચાનક એવું લાગવું કે તે તણાવભરી ઘટના ફરીથી બની રહી છે, અથવા તમે જાણે તેને ફરીથી જીવી રહ્યા હો એમ વર્તવું?"},"simple":{"en":"Have you suddenly felt or acted as if that event was happening again?","hi":"क्या अचानक आपको ऐसा लगा या आपने ऐसा बर्ताव किया, जैसे वह घटना फिर हो रही हो?","gu":"શું અચાનક તમને એવું લાગ્યું, અથવા તમે એવું વર્ત્યા, જાણે એ ઘટના ફરી બની રહી હોય?"}},{"id":"pcl5_4","text":{"en":"Feeling very upset when something reminded you of the stressful experience?","hi":"किसी बात से उस तनावपूर्ण घटना की याद आने पर बहुत परेशान होना?","gu":"કોઈ બાબતથી તે તણાવભરી ઘટનાની યાદ આવે ત્યારે ખૂબ અસ્વસ્થ થવું?"},"simple":{"en":"Have you felt very upset when something reminded you of that event?","hi":"क्या उस परेशान करने वाली घटना की याद दिलाने वाली किसी बात से आप बहुत परेशान हुए?","gu":"શું એ પરેશાન કરનારી ઘટનાની યાદ અપાવતી કોઈ વાતથી તમે બહુ પરેશાન થયા?"}},{"id":"pcl5_5","text":{"en":"Having strong physical reactions when something reminded you of the stressful experience (for example, heart pounding, trouble breathing, sweating)?","hi":"उस तनावपूर्ण घटना की याद आने पर शरीर में तेज़ प्रतिक्रिया होना, जैसे दिल तेज़ धड़कना, साँस लेने में कठिनाई या पसीना आना?","gu":"તે તણાવભરી ઘટનાની યાદ આવે ત્યારે શરીરમાં તીવ્ર પ્રતિક્રિયા થવી, જેમ કે હૃદય જોરથી ધડકવું, શ્વાસ લેવામાં તકલીફ થવી કે પરસેવો આવવો?"},"simple":{"en":"Did reminders of that event make your body react strongly? Did your heart race, breathing become hard, or body sweat?","hi":"क्या उस घटना की याद दिलाने वाली बातों से आपके शरीर में तेज़ असर हुआ? क्या दिल तेज़ धड़का, साँस लेने में दिक्कत हुई या पसीना आया?","gu":"શું એ ઘટનાની યાદ અપાવતી વાતોથી તમારા શરીરમાં જોરદાર ફેરફાર થયો? શું હૃદય ઝડપથી ધડક્યું, શ્વાસ લેવામાં તકલીફ પડી કે પરસેવો આવ્યો?"}},{"id":"pcl5_6","text":{"en":"Avoiding memories, thoughts, or feelings related to the stressful experience?","hi":"उस तनावपूर्ण घटना से जुड़ी यादों, विचारों या भावनाओं से बचना?","gu":"તે તણાવભરી ઘટનાને લગતી યાદો, વિચારો કે લાગણીઓથી દૂર રહેવાનો પ્રયત્ન કરવો?"},"simple":{"en":"Have you tried to avoid memories, thoughts, or feelings about that event?","hi":"क्या आपने उस परेशान करने वाली घटना की यादों, खयालों या भावनाओं से बचने की कोशिश की?","gu":"શું તમે એ પરેશાન કરનારી ઘટનાની યાદો, વિચારો કે લાગણીઓથી બચવાનો પ્રયત્ન કર્યો?"}},{"id":"pcl5_7","text":{"en":"Avoiding external reminders of the stressful experience (for example, people, places, conversations, activities, objects, or situations)?","hi":"उस तनावपूर्ण घटना की याद दिलाने वाली बाहरी चीज़ों से बचना, जैसे लोग, जगहें, बातचीत, काम, वस्तुएँ या हालात?","gu":"તે તણાવભરી ઘટનાની યાદ અપાવતી બહારની બાબતોથી દૂર રહેવું, જેમ કે લોકો, સ્થળો, વાતચીત, પ્રવૃત્તિઓ, વસ્તુઓ કે પરિસ્થિતિઓ?"},"simple":{"en":"Have you avoided people, places, talks, or things that remind you of that event?","hi":"क्या आप उन लोगों, जगहों, बातचीत या चीज़ों से दूर रहे हैं जो आपको उस घटना की याद दिलाते हैं?","gu":"શું તમે એવા લોકો, સ્થળો, વાતચીત કે વસ્તુઓથી દૂર રહ્યા છો જે તમને એ ઘટનાની યાદ અપાવે છે?"}},{"id":"pcl5_8","text":{"en":"Trouble remembering important parts of the stressful experience?","hi":"उस तनावपूर्ण घटना के महत्वपूर्ण हिस्सों को याद करने में कठिनाई होना?","gu":"તે તણાવભરી ઘટનાના મહત્વના ભાગો યાદ કરવામાં મુશ્કેલી થવી?"},"simple":{"en":"Have you had trouble remembering important parts of that event?","hi":"क्या आपको उस परेशान करने वाली घटना की ज़रूरी बातें याद करने में दिक्कत हुई?","gu":"શું તમને એ પરેશાન કરનારી ઘટનાની જરૂરી વાતો યાદ કરવામાં તકલીફ થઈ?"}},{"id":"pcl5_9","text":{"en":"Having strong negative beliefs about yourself, other people, or the world (for example, having thoughts such as: I am bad, there is something seriously wrong with me, no one can be trusted, the world is completely dangerous)?","hi":"अपने बारे में, दूसरे लोगों के बारे में या दुनिया के बारे में बहुत नकारात्मक धारणाएँ होना, जैसे 'मैं बुरा हूँ', 'मुझमें कोई गंभीर कमी है', 'किसी पर भरोसा नहीं किया जा सकता' या 'दुनिया पूरी तरह ख़तरनाक है'?","gu":"પોતાના વિશે, બીજા લોકો વિશે કે દુનિયા વિશે ખૂબ નકારાત્મક માન્યતાઓ થવી, જેમ કે 'હું ખરાબ છું', 'મારામાં કંઈક ગંભીર ખામી છે', 'કોઈનો વિશ્વાસ કરી શકાય નહીં' કે 'દુનિયા સંપૂર્ણપણે જોખમી છે'?"},"simple":{"en":"Have you strongly believed bad things about yourself, other people, or the world? For example, that you are bad, nobody can be trusted, or nowhere is safe?","hi":"क्या आप अपने, दूसरों या दुनिया के बारे में बुरी बातें पक्के तौर पर सच मानते हैं? जैसे आप बुरे हैं, किसी पर भरोसा नहीं कर सकते, या कहीं सुरक्षित नहीं हैं?","gu":"શું તમે તમારા, બીજા લોકો કે દુનિયા વિશે ખરાબ વાતોને પાકી સાચી માનો છો? જેમ કે તમે ખરાબ છો, કોઈ પર ભરોસો ન કરી શકાય, કે કોઈ જગ્યા સલામત નથી?"}},{"id":"pcl5_10","text":{"en":"Blaming yourself or someone else for the stressful experience or what happened after it?","hi":"उस तनावपूर्ण घटना के लिए या उसके बाद जो हुआ उसके लिए खुद को या किसी और को दोष देना?","gu":"તે તણાવભરી ઘટના માટે કે ત્યાર પછી જે બન્યું તેના માટે પોતાને અથવા બીજા કોઈને દોષ આપવો?"},"simple":{"en":"Have you blamed yourself or someone else for that event or what happened afterward?","hi":"क्या आपने उस घटना या उसके बाद जो हुआ, उसके लिए खुद को या किसी और को दोष दिया है?","gu":"શું તમે એ ઘટના માટે કે તેના પછી જે થયું તેના માટે પોતાને કે બીજા કોઈને દોષ આપ્યો છે?"}},{"id":"pcl5_11","text":{"en":"Having strong negative feelings such as fear, horror, anger, guilt, or shame?","hi":"डर, आतंक, गुस्सा, अपराधबोध या शर्म जैसी तीखी नकारात्मक भावनाएँ होना?","gu":"ડર, ભારે ગભરાટ, ગુસ્સો, અપરાધભાવ કે શરમ જેવી તીવ્ર નકારાત્મક લાગણીઓ થવી?"},"simple":{"en":"Have you felt strong fear, horror, anger, guilt, or shame?","hi":"क्या आपको बहुत डर, दहशत, गुस्सा या शर्म आई है, या आपने खुद को कसूरवार महसूस किया है?","gu":"શું તમને ખૂબ ડર, ભય, ગુસ્સો કે શરમ લાગી છે, અથવા તમને પોતાનો વાંક લાગ્યો છે?"}},{"id":"pcl5_12","text":{"en":"Loss of interest in activities that you used to enjoy?","hi":"जिन कामों में पहले आनंद आता था, उनमें रुचि कम हो जाना?","gu":"પહેલાં ગમતી પ્રવૃત્તિઓમાં રસ ઘટી જવો?"},"simple":{"en":"Have you lost interest in things you used to enjoy?","hi":"क्या जिन कामों में पहले मज़ा आता था, उनमें अब आपकी दिलचस्पी कम हो गई?","gu":"શું જે કામમાં પહેલાં આનંદ આવતો હતો, તેમાં હવે તમારો રસ ઓછો થયો છે?"}},{"id":"pcl5_13","text":{"en":"Feeling distant or cut off from other people?","hi":"दूसरे लोगों से दूर या कटा हुआ महसूस करना?","gu":"બીજા લોકોથી દૂર કે અલગ પડી ગયા હોય એવું લાગવું?"},"simple":{"en":"Have you felt far away or cut off from other people?","hi":"क्या आपको लगा कि आप दूसरे लोगों से दूर या अलग हो गए हैं?","gu":"શું તમને લાગ્યું કે તમે બીજા લોકોથી દૂર કે અલગ થઈ ગયા છો?"}},{"id":"pcl5_14","text":{"en":"Trouble experiencing positive feelings (for example, being unable to feel happiness or have loving feelings for people close to you)?","hi":"अच्छी भावनाएँ महसूस करने में कठिनाई होना, जैसे खुशी महसूस न कर पाना या अपने करीबियों के लिए प्यार महसूस न कर पाना?","gu":"હકારાત્મક લાગણીઓ અનુભવવામાં મુશ્કેલી થવી, જેમ કે ખુશી ન અનુભવવી અથવા નજીકના લોકો માટે પ્રેમ ન અનુભવી શકવો?"},"simple":{"en":"Have you had trouble feeling happy or feeling love for people close to you?","hi":"क्या आपको खुशी महसूस करने या अपने करीबी लोगों के लिए प्यार महसूस करने में दिक्कत हुई?","gu":"શું તમને આનંદ અનુભવવામાં કે તમારા નજીકના લોકો માટે પ્રેમ અનુભવવામાં તકલીફ થઈ?"}},{"id":"pcl5_15","text":{"en":"Irritable behavior, angry outbursts, or acting aggressively?","hi":"चिड़चिड़ा व्यवहार करना, गुस्से में फट पड़ना या आक्रामक ढंग से पेश आना?","gu":"ચીડિયું વર્તન કરવું, ગુસ્સાથી ભડકી ઊઠવું અથવા આક્રમક વર્તન કરવું?"},"simple":{"en":"Have you been easily annoyed, had sudden anger, or acted in a rough way with others?","hi":"क्या आप जल्दी चिढ़े, अचानक गुस्सा हुए, या दूसरों के साथ रूखा या लड़ाई वाला बर्ताव किया?","gu":"શું તમે જલદી ચીડાયા, અચાનક ગુસ્સે થયા, કે બીજાઓ સાથે ગુસ્સામાં ખરાબ રીતે વર્ત્યા?"}},{"id":"pcl5_16","text":{"en":"Taking too many risks or doing things that could cause you harm?","hi":"बहुत जोखिम लेना या ऐसे काम करना जिनसे आपको नुकसान हो सकता है?","gu":"ઘણું જોખમ લેવું અથવા પોતાને નુકસાન થઈ શકે એવા કામ કરવાં?"},"simple":{"en":"Have you taken big chances or done things that could hurt you?","hi":"क्या आपने बहुत ख़तरा उठाया या ऐसे काम किए जिनसे आपको चोट पहुँच सकती थी?","gu":"શું તમે બહુ જોખમ લીધું કે એવું કંઈ કર્યું જેનાથી તમને નુકસાન થઈ શકે?"}},{"id":"pcl5_17","text":{"en":"Being \"superalert\" or watchful or on guard?","hi":"हर समय बहुत चौकन्ना या सतर्क रहना?","gu":"હંમેશાં ખૂબ સાવચેત કે સતર્ક રહેવું?"},"simple":{"en":"Have you stayed very watchful, as if you needed to guard yourself?","hi":"क्या आप बहुत चौकन्ने रहे हैं, जैसे आपको अपनी सुरक्षा का ध्यान रखना पड़े?","gu":"શું તમે ખૂબ ચોકન્ના રહ્યા છો, જાણે તમારે પોતાની રક્ષા કરવી પડે?"}},{"id":"pcl5_18","text":{"en":"Feeling jumpy or easily startled?","hi":"आसानी से चौंक जाना या झटका लगना?","gu":"સરળતાથી ચોંકી જવું કે ગભરાઈ જવું?"},"simple":{"en":"Have you felt jumpy or been startled easily?","hi":"क्या आप जल्दी चौंक गए या छोटी बात पर उछल पड़े?","gu":"શું તમે જલદી ચોંકી ગયા કે નાની વાતે ઝટકો લાગ્યો?"}},{"id":"pcl5_19","text":{"en":"Having difficulty concentrating?","hi":"ध्यान लगाने में कठिनाई होना?","gu":"ધ્યાન એકાગ્ર કરવામાં મુશ્કેલી થવી?"},"simple":{"en":"Have you had trouble focusing your mind?","hi":"क्या आपको ध्यान लगाने में परेशानी हुई?","gu":"શું તમને ધ્યાન રાખવામાં તકલીફ થઈ?"}},{"id":"pcl5_20","text":{"en":"Trouble falling or staying asleep?","hi":"नींद आने या सोते रहने में कठिनाई होना?","gu":"ઊંઘ આવવામાં કે આખી રાત ઊંઘી રહેવામાં મુશ્કેલી થવી?"},"simple":{"en":"Have you had trouble falling asleep or staying asleep?","hi":"क्या आपको नींद आने या नींद में बने रहने में परेशानी हुई?","gu":"શું તમને ઊંઘ આવવામાં કે ઊંઘ ચાલુ રાખવામાં તકલીફ થઈ?"}}]},{"id":"k10","name":"K10","holder":"Ronald C. Kessler, Harvard Medical School","credit_line":"K10; Kessler RC, Andrews G, Colpe LJ and colleagues, Psychological Medicine 2002;32:959-976; Harvard Medical School.","licence":{"summary":"Holder page: use is free with the citation; the form says reproducing or translating it needs the holder's permission. This tool shows short reminders and links the official form.","url":"https://rckessler.scholars.harvard.edu/k10-and-k6-scales"},"wording":{"status":"reminder","url":"https://rckessler.scholars.harvard.edu/sites/g/files/omnuum8166/files/2026-03/Self%20admin_K10.pdf","notice":"Short reminders, not the official words. Read the official form."},"offer_when":{"text":"Offer when the person reports distress that does not fit another concern group; a general distress screen for the doctor.","source_url":"https://rckessler.scholars.harvard.edu/k10-and-k6-scales"},"offer_at":[{"flow":"oth.other","question":"review","answer":"yes"},{"flow":"oth.other","question":"review","answer":"no"}],"source_url":"https://rckessler.scholars.harvard.edu/sites/g/files/omnuum8166/files/2026-03/Self%20admin_K10.pdf","translation":{"hi":{"status":"ours","notice":"Our short reminders in Hindi, not a validated translation"},"gu":{"status":"ours","notice":"Our short reminders in Gujarati, not a validated translation"}},"timeframe_stem":{"en":"In the past 30 days, how often did the person feel this?","hi":"पिछले 30 दिनों में ऐसा कितनी बार लगा?","gu":"છેલ્લા 30 દિવસમાં આવું કેટલી વાર લાગ્યું?"},"response_options":[{"code":1,"text":{"en":"None of the time","hi":"कभी नहीं","gu":"ક્યારેય નહીં"}},{"code":2,"text":{"en":"A little of the time","hi":"थोड़े समय","gu":"થોડો સમય"}},{"code":3,"text":{"en":"Some of the time","hi":"कुछ समय","gu":"કેટલોક સમય"}},{"code":4,"text":{"en":"Most of the time","hi":"ज़्यादातर समय","gu":"મોટા ભાગનો સમય"}},{"code":5,"text":{"en":"All of the time","hi":"हर समय","gu":"આખો સમય"}}],"items":[{"id":"k10_1","text":{"en":"Tired out for no good reason","hi":"बिना कारण बहुत थकान","gu":"કારણ વગર ખૂબ થાક"},"simple":{"en":"Have you felt very tired without a clear reason?","hi":"क्या आपको बिना किसी साफ़ वजह के बहुत थकान लगी?","gu":"શું તમને કોઈ સ્પષ્ટ કારણ વગર બહુ થાક લાગ્યો?"}},{"id":"k10_2","text":{"en":"Nervous","hi":"घबराहट","gu":"ગભરાટ"},"simple":{"en":"Have you felt nervous?","hi":"क्या आपको घबराहट हुई है?","gu":"શું તમને ગભરાટ થયો છે?"}},{"id":"k10_3","text":{"en":"So nervous that nothing could calm them down","hi":"इतनी घबराहट कि कुछ भी शांत न कर सके","gu":"એટલો ગભરાટ કે કંઈ શાંત ન કરી શકે"},"simple":{"en":"Have you felt so nervous that nothing could calm you?","hi":"क्या आपको इतनी घबराहट हुई कि किसी भी तरह आपका मन शांत नहीं हुआ?","gu":"શું તમને એટલો ગભરાટ થયો કે કોઈ પણ રીતે તમારું મન શાંત ન થયું?"}},{"id":"k10_4","text":{"en":"Hopeless","hi":"निराशा, कोई उम्मीद नहीं","gu":"નિરાશા, કોઈ આશા નહીં"},"simple":{"en":"Have you felt that there was no hope?","hi":"क्या आपको लगा कि कोई उम्मीद नहीं बची?","gu":"શું તમને લાગ્યું કે હવે કોઈ આશા નથી?"}},{"id":"k10_5","text":{"en":"Restless or fidgety","hi":"बेचैनी","gu":"બેચેની"},"simple":{"en":"Have you felt restless or unable to keep still?","hi":"क्या आपको बेचैनी हुई या चुपचाप रहना मुश्किल लगा?","gu":"શું તમને બેચેની થઈ કે શાંતિથી રહેવું મુશ્કેલ લાગ્યું?"}},{"id":"k10_6","text":{"en":"So restless they could not sit still","hi":"इतनी बेचैनी कि बैठ न सकें","gu":"એટલી બેચેની કે બેસી ન શકે"},"simple":{"en":"Have you felt so restless that you could not sit still?","hi":"क्या आप इतने बेचैन रहे कि चुपचाप बैठ नहीं पाए?","gu":"શું તમે એટલા બેચેન રહ્યા કે શાંતિથી બેસી ન શક્યા?"}},{"id":"k10_7","text":{"en":"Depressed (low or sad)","hi":"उदासी, मन उदास","gu":"ઉદાસી, મન ઉદાસ"},"simple":{"en":"Have you felt very low or sad?","hi":"क्या आपका मन बहुत उदास रहा?","gu":"શું તમારું મન બહુ ઉદાસ રહ્યું?"}},{"id":"k10_8","text":{"en":"Everything was an effort","hi":"हर काम भारी लगा","gu":"દરેક કામ ભારે લાગ્યું"},"simple":{"en":"Have you felt that everything took effort?","hi":"क्या आपको लगा कि हर काम करने में बहुत ज़ोर लगाना पड़ा?","gu":"શું તમને લાગ્યું કે દરેક કામ કરવામાં બહુ જોર લગાવવું પડ્યું?"}},{"id":"k10_9","text":{"en":"So sad that nothing could cheer them up","hi":"इतनी उदासी कि कुछ भी खुश न कर सके","gu":"એટલી ઉદાસી કે કંઈ ખુશ ન કરી શકે"},"simple":{"en":"Have you felt so sad that nothing could cheer you up?","hi":"क्या आप इतने उदास रहे कि किसी भी बात से आपका मन अच्छा नहीं हुआ?","gu":"શું તમે એટલા ઉદાસ રહ્યા કે કોઈ પણ વાતથી તમારું મન સારું ન થયું?"}},{"id":"k10_10","text":{"en":"Worthless","hi":"खुद को बेकार समझना","gu":"પોતાને નકામા સમજવું"},"simple":{"en":"Have you felt that you were worth nothing?","hi":"क्या आपको लगा कि आपकी कोई कीमत नहीं है?","gu":"શું તમને લાગ્યું કે તમારી કોઈ કિંમત નથી?"}}],"scoring":{"method":"sum the ten 1-5 responses; 10-50; screening only, the doctor reviews the result","range":[10,50],"band_label":"Andrews and Slade 2001 band","bands":[{"min":10,"max":19,"label":"likely well"},{"min":20,"max":24,"label":"mild distress"},{"min":25,"max":29,"label":"moderate distress"},{"min":30,"max":50,"label":"severe distress"}],"source_url":"https://www.abs.gov.au/ausstats/abs%40.nsf/bb8db737e2af84b8ca2571780015701e/34333D54F054CE51CA2579D50015D786"},"danger_items":[]}],"links":[{"id":"who5","name":"WHO-5","url":"https://www.who.int/publications/m/item/WHO-UCN-MSD-MHE-2024.01","offer_at":[{"flow":"dep.depression","question":"low_mood"}]},{"id":"audit","name":"AUDIT","url":"https://www.who.int/publications/i/item/WHO-MSD-MSB-01.6a","offer_at":[{"flow":"sub.alcohol","question":"use"}]},{"id":"assist","name":"ASSIST","url":"https://www.who.int/publications/i/item/978924159938-2","offer_at":[{"flow":"sub.drugs","question":"opioid"}]},{"id":"whodas","name":"WHODAS 2.0","url":"https://www.who.int/standards/classifications/international-classification-of-functioning-disability-and-health/who-disability-assessment-schedule","offer_at":[{"flow":"dep.depression","question":"function"},{"flow":"gap.gad","question":"screen2"}]}],"unavailable":[]};</script>
  <script>
// First-history rules engine. Pure functions: the library (library/history.v0.json) holds the clinical content,
// this file only walks its yes/no questions and fills the fixed note. No AI. Works in Node and the browser.
(function (root) {
  const ANSWERED = ["yes", "no"];

  function flowOf(lib, id) {
    const f = lib.flows[id];
    if (!f) throw new Error(`library has no flow ${id}`);
    return f;
  }

  // A question whose "yes" ends the flow with a call to the doctor. Not knowing its answer must not stop the history.
  function isCallGate(f, q) {
    return q.yes.startsWith("end:") && f.ends[q.yes.slice(4)]?.kind === "call-doctor";
  }

  // answers: { qid: "yes" | "no" | "unknown" }. Returns { path, end, next, flags }:
  // end is the reached end ({id, kind, ...}), an "incomplete" end at an unknown answer, or null with next = qid to ask.
  // An unknown answer to a call-the-doctor question is flagged and the walk carries on down its "no" branch.
  // past = true walks on past a doctor call that is the last question before an ending (yes -> the "no" ending; a
  // "physical cause?" call is never walked past, fresh review 2026-10-10) and past "not sure" (-> the "no" route, kept in unsure),
  // so the note can still show the doctor which condition the other answers point to (blind test B01, B04, 2026-10-10).
  function walkFlow(lib, flowId, answers, past = false) {
    const f = flowOf(lib, flowId);
    const path = [], flags = [], uncertain = [], unsure = [];
    let qid = f.start;
    while (true) {
      if (path.includes(qid)) throw new Error(`loop in ${flowId} at ${qid}`);
      const q = f.questions[qid];
      if (!q) throw new Error(`${flowId} has no question ${qid}`);
      path.push(qid);
      const a = answers[qid];
      if (a === undefined || a === null || a === "") return { path, end: null, next: qid, flags, uncertain, unsure };
      let target;
      if (past && a === 'yes' && isCallGate(f, q) && q.no.startsWith("end:")) target = q.no;
      else if (ANSWERED.includes(a)) target = q[a];
      else if (isCallGate(f, q)) { flags.push(qid); target = q.no; }
      else if (a === 'unknown' && q.unknown) target = q.unknown;
      else if (lib.sequence?.includes("glance") && /body|physical|medical|medicine cause/i.test(`${qid} ${q.ask}`)) { uncertain.push(qid); target = q.no; }
      else if (past) { unsure.push(qid); target = q.no; }
      else return { path, end: { id: null, kind: "incomplete", at: qid, say: "Not answered: doctor to assess" }, next: null, flags, uncertain };
      if (target.startsWith("end:")) {
        const id = target.slice(4);
        const end = f.ends[id];
        if (!end) throw new Error(`${flowId} has no end ${id}`);
        return { path, end: { id, ...end }, next: null, flags, uncertain, unsure };
      }
      qid = target;
    }
  }

  function openFlows(lib, presentationIds) {
    const out = [];
    for (const pid of presentationIds) {
      const p = lib.presentations.find((x) => x.id === pid);
      if (!p) throw new Error(`library has no presentation ${pid}`);
      for (const f of p.opens) if (!out.includes(f)) out.push(f);
    }
    return out;
  }

  // Any danger item not answered "no" goes to the doctor: a yes, and also an unknown or unasked one.
  function dangerHits(lib, danger) {
    return (lib.danger || []).filter((d) => danger[d.id] !== "no");
  }

  function measureEligible(lib, record, measure) {
    return (measure.offer_at || []).some((at) => {
      if (at.danger) return (lib.ask_danger || []).some((x) => x.id === at.danger) && record.danger?.[at.danger] === at.answer;
      if (!at.flow || !lib.flows[at.flow] || !lib.flows[at.flow].questions[at.question]) return false;
      if (!openFlows(lib, record.presentations || []).includes(at.flow)) return false;
      const answers = record.flowAnswers?.[at.flow] || {};
      return answers[at.question] === at.answer && walkFlow(lib, at.flow, answers).path.includes(at.question);
    });
  }

  function offeredMeasure(lib, measures, record, at) {
    return (measures?.measures || []).find((m) => !['complete','skipped'].includes(record.measureResults?.[m.id]?.status) && (m.offer_at || []).some((place) =>
      place.answer === at.answer && place.flow === at.flow && place.question === at.question && place.danger === at.danger
    ) && measureEligible(lib, record, m));
  }

  function measureQuestions(measure, answers = {}) {
    if (measure.id !== 'cssrs') return measure.items;
    // Items 3-5 follow a yes on item 2; they stay on screen while item 4 or 5 holds a yes, so a danger answer is
    // never dropped by changing item 2 and staff can see and change it (re-review 2026-10-10).
    const open = answers.cssrs_2 === 'yes' || answers.cssrs_4 === 'yes' || answers.cssrs_5 === 'yes';
    return measure.items.filter((item) => !['cssrs_3','cssrs_4','cssrs_5'].includes(item.id) || open);
  }

  function scoreMeasure(measure, answers, followUps = {}, language = 'en') {
    const items = measureQuestions(measure, answers);
    for (const item of items) if (!measure.response_options.some((option) => option.code === answers[item.id])) throw new Error(`${measure.id}: answer missing or invalid for ${item.id}`);
    if (measure.id === 'cssrs' && answers.cssrs_6 === 'yes' && !['yes','no'].includes(followUps.cssrs_6_recent)) throw new Error('cssrs: recent behaviour answer missing');
    const accepted = Object.fromEntries(items.map((item) => [item.id, answers[item.id]]));
    const total = measure.scoring.range ? items.reduce((sum, item) => sum + Number(accepted[item.id]), 0) : null;
    const band = total === null ? null : measure.scoring.bands.find((entry) => total >= entry.min && total <= entry.max)?.label || null;
    return {status:'complete',answers:accepted,followUps:measure.id === 'cssrs' && answers.cssrs_6 === 'yes' ? {cssrs_6_recent:followUps.cssrs_6_recent} : {},language,total,band};
  }

  // Answers actually given, from a finished or a skipped questionnaire; a given answer counts even if
  // the history answer that opened the questionnaire is later changed.
  function givenAnswers(measure, result) {
    if (!result || !['complete','skipped','started'].includes(result.status)) return null;
    const answers = {};
    for (const item of measure.items) if (measure.response_options.some((option) => option.code === result.answers?.[item.id])) answers[item.id] = result.answers[item.id];
    return {answers, followUps:result.followUps || {}};
  }

  function measureFlags(lib, record, measures) {
    const flags = [];
    for (const measure of measures?.measures || []) {
      const valid = givenAnswers(measure, record.measureResults?.[measure.id]);
      if (!valid) continue;
      for (const danger of measure.danger_items || []) {
        const answer = valid.answers[danger.item_id];
        const hit = danger.codes ? danger.codes.includes(answer) : answer === danger.answer;
        if (!hit || danger.when === 'yes and within past 3 months' && valid.followUps.cssrs_6_recent === 'no') continue;
        const item = measure.items.find((x) => x.id === danger.item_id);
        const option = measure.response_options.find((x) => x.code === answer);
        const n = measure.items.indexOf(item) + 1;
        flags.push({question:`${measure.name} item ${n}: "${item.text.en}"`,answer:option.text.en,source:{source_id:measure.name,ref:measure.source_url}});
      }
    }
    return flags;
  }

  // A single list drives the pinned reminder, the final call screen, and line two of the note.
  function redFlags(lib, record, measures) {
    const flags = [];
    const add = (question, answer, source) => flags.push({ question, answer: answer === 'unknown' ? 'not sure' : answer, source });
    for (const item of lib.glance || []) if (record.glance?.[item.id] === 'yes') add(item.ask || item.label, 'yes', item);
    for (const item of lib.ask_danger || []) {
      const answer = record.danger?.[item.id];
      if (answer === 'yes' || answer === 'unknown') add(item.ask || item.label, answer, item);
    }
    const opened = openFlows(lib, record.presentations || []);
    for (const fid of opened.concat(Object.keys(record.flowAnswers || {}).filter((id) => !opened.includes(id)))) {
      const flow = flowOf(lib, fid), answers = record.flowAnswers?.[fid] || {};
      for (const qid of Object.keys(answers)) {
        const q = flow.questions[qid], answer = answers[qid];
        if (!q) continue;
        if (isCallGate(flow, q) && (answer === 'yes' || answer === 'unknown')) add(q.ask, answer, q);
        else if (answer === 'yes' || answer === 'no') {
          const target = q[answer];
          if (target.startsWith('end:') && flow.ends[target.slice(4)]?.kind === 'call-doctor') add(q.ask, answer, q);
        }
      }
    }
    const all = flags.concat(measureFlags(lib, record, measures));
    for (const e of record.earlierCalls || []) if (!all.some((f) => f.question === e.question)) all.push(e);
    return all;
  }

  // Two sentences carry the same fact when they use the same content words in any order.
  const factKey = (s) => { const w = String(s).toLowerCase().replace(/[^a-z0-9 -]/g, ' ').split(/[\s-]+/)
    .filter((x) => x.length > 2 && !['the', 'and', 'for', 'was', 'with', 'any', 'reported'].includes(x)).sort(); return w.length < 3 ? '' : w.join(' '); };
  // "No X observed." sentences are joined into one "Not observed: X; Y." sentence (the same for "reported").
  function joinNegatives(list) {
    const groups = {observed: [], reported: []}, rest = [];
    for (const s of list) { const m = /^No (.+?) (observed|reported)\.$/.exec(s); if (m) groups[m[2]].push(m[1]); else rest.push(s); }
    const joined = (word, items) => items.length > 1 ? [`Not ${word}: ${items.join('; ')}.`] : items.map((x) => `No ${x} ${word}.`);
    return [...rest, ...joined('observed', groups.observed), ...joined('reported', groups.reported)];
  }

  // mhGAP prints cautions beside each dose; the note carries them under the dose (uncraft 2026-10-10).
  const caution = (m) => (m.caution_as_in_mhgap && !/^NOT CHECKED/.test(m.caution_as_in_mhgap)
    ? `Caution (mhGAP p. ${m.caution_page || m.page}): ${m.caution_as_in_mhgap}`
    : `Caution not recorded: doctor to check the cautions on mhGAP p. ${m.page}`);
  const pg = (x) => (x.page ? ` (${x.source_id && x.source_id !== 'who-mhgap' ? `${x.source_id} p.` : 'mhGAP p.'} ${x.page})` : x.ref ? ` (${x.source_id} ${x.ref})` : "");

  // record: { interview: {fieldId: value}, danger: {id: answer}, presentations: [ids],
  //           flowAnswers: {flowId: {qid: answer}}, mse: {id: text} }
  // Reference codes for the doctor to choose from; staff never pick one.
  function codeLine(x) {
    const c = x.codes;
    if (!c) return [];
    const part = (name, list) => (list || []).length ? `${name} ${list.map(([code, title]) => `${code} ${title}`).join("; ")}` : null;
    const parts = [part("ICD-11", c.icd11), part("ICD-10", c.icd10), (c.dsm5tr || []).length ? `DSM-5-TR ${c.dsm5tr.join("; ")}` : null].filter(Boolean);
    return parts.length ? [`  Codes for the doctor to choose from (reference only): ${parts.join(" · ")}`] : [];
  }

  function buildNote(lib, record, measures) {
    if (lib.sequence?.includes("glance")) return buildCaseRecord(lib, record, measures);

  function buildOldNote(lib, record) {
    const out = [lib.note.header];
    const gaps = [];
    const hits = dangerHits(lib, record.danger || {});
    const calls = hits.map((d) => `${d.ask} [${record.danger?.[d.id] || "not asked"}]`);
    const callAt = out.length;
    if (record.patient) out.push(`Patient: ${record.patient} · history taken by: ${record.role || "not recorded"}`);

    for (const sec of lib.interview) {

    const suggested = [], specialist = [], unlikely = [], incomplete = [];
    const flows = record.flowAnswers ? Object.keys(record.flowAnswers) : [];
    const opened = openFlows(lib, record.presentations || []);
    for (const fid of opened.concat(flows.filter((f) => !opened.includes(f)))) {
      const f = flowOf(lib, fid);
      const r = walkFlow(lib, fid, record.flowAnswers?.[fid] || {});

      if (!r.end) { gaps.push(`${f.name}: ${f.questions[r.next].ask}`); incomplete.push(`${f.name}: questions not finished`); continue; }
      if (r.end.kind === "incomplete") { gaps.push(`${f.name}: ${f.questions[r.end.at].ask}`); incomplete.push(`${f.name}: ${r.end.say}`); continue; }

      else if (r.end.kind === "unlikely") unlikely.push(`${f.name}: ${r.end.say}${pg(r.end)}`);
      else if (r.end.kind === "call-doctor") calls.push(`${r.end.say}${pg(r.end)}`);

    if (calls.length) out.splice(callAt, 0, `CALL THE DOCTOR NOW: ${calls.join("; ")}`);

    out.push("", "Suggested for the doctor to confirm (not a diagnosis)");
    if (!suggested.length) out.push("- none from these answers");
    for (const { end } of suggested) out.push(`- ${end.say}${pg(end)}`, ...codeLine(end));
    for (const e of specialist) out.push(`- Doctor to assess: ${e.say}${pg(e)}`, ...codeLine(e));
    for (const d of hits.filter((h) => h.codes)) out.push(`- Doctor to assess (danger answer: ${record.danger?.[d.id] || "not asked"}): ${d.ask}${pg(d)}`, ...codeLine(d));
    for (const s of incomplete) out.push(`- Doctor to assess: ${s}`);
    if (unlikely.length) out.push("", "Considered and not suggested", ...unlikely.map((s) => `- ${s}`));

    for (const { f } of suggested) {
      const plan = f.plan || {};
      out.push("", `Plan options for ${f.name}`);
      for (const p of plan.psychosocial || []) out.push(`- ${p.text}${pg(p)}`);
      if ((plan.medicine_options || []).length) {
        out.push("  Medicine options, for the doctor to decide:");
        for (const m of plan.medicine_options) out.push(`  - ${m.name}: ${m.dose_as_in_mhgap}${pg(m)}`, `  ${caution(m)}`);
      }
      for (const p of plan.follow_up || []) out.push(`- Follow-up: ${p.text}${pg(p)}`);
      for (const p of plan.refer_when || []) out.push(`- Refer when: ${p.text}${pg(p)}`);

    out.push("", "Not asked or not answered");
    out.push(...(gaps.length ? gaps.map((g) => `- ${g}`) : ["- nothing"]));

  }

  function buildCaseRecord(lib, record, measures) {
    const out = [lib.note.header], gaps = [], calls = redFlags(lib, record, measures);
    const value = (id) => record.interview?.[id];
    const known = (v) => v !== undefined && v !== null && String(v).trim() !== '';
    const field = (sec, id) => lib.interview.find((s) => s.id === sec)?.fields.find((f) => f.id === id);
    // Staff text keeps its words; one trailing full stop is dropped because the template adds its own (uncraft 2026-10-10).
    const staff = (v) => String(v).trim().replace(/(?<!\.)\.$/, '');
    const sentence = (f, v) => (f.note || `${f.label}: {value}.`).replaceAll('{value}', staff(v));
    const pregnancyField = lib.interview.flatMap((s) => s.fields).find((f) => /pregnan/i.test(f.id));

    const pregnancyApplies = !!when && String(value('sex')).toLowerCase() === when.sex && Number(value('age')) >= when.age_min && Number(value('age')) <= when.age_max;

        used.push(id);
        const v = id === 'patient' ? record.patient : id === 'role' ? record.role : value(id);
        if (!known(v)) { missing = true; const f = allFields.find((x) => x.id === id); if (f) gaps.push(f.label); return ''; }

      const lines = [];

        if (exclude.includes(f.id)) continue;

    // is not written again (B01 printed "Current thoughts of self-harm. Current self-harm thoughts.", 2026-10-10).

    const fresh = (lines) => lines.filter((t) => { const k = factKey(t); if (!k) return true; if (said.has(k)) return false; said.add(k); return true; });

    const dangerLists = [{items: lib.glance || [], answers: record.glance || {}}, {items: lib.ask_danger || [], answers: record.danger || {}}];
    const risk = [], safetyGaps = [];
    for (const {items, answers} of dangerLists) for (const item of items) {

    const usedIds = [];
    const identity = lib.note.identity
      ? [fill(lib.note.identity, usedIds), ...sectionSentences('intake', usedIds), fill(lib.note.identity_after || [], usedIds)].filter((t) => /\w/.test(t))
      : [`${record.patient || 'Patient not recorded'}, history taken by: ${record.role || 'not recorded'}`, ...sectionSentences('intake')];
    writeSection('Identifying data:', identity);
    const complaint = lib.note.chief_complaint ? [capital(fill(lib.note.chief_complaint, []))].filter((t) => t && t !== '.') : ['main_words','duration'].map((id) => {
      const f = field('complaint', id);
      if (!f) return '';
      if (!known(value(id))) { gaps.push(f.label); return ''; }
      return sentence(f, value(id));
    }).filter(Boolean);
    writeSection('Chief complaints:', complaint);
    const hpi = sectionSentences('complaint', ['main_words','duration']);
    const positives = [], negatives = [], suggested = [], consults = [], unlikely = [], incomplete = [], plans = [];
    const opened = openFlows(lib, record.presentations || []);
    for (const fid of opened.concat(Object.keys(record.flowAnswers || {}).filter((id) => !opened.includes(id)))) {
      const f = flowOf(lib, fid), answers = record.flowAnswers?.[fid] || {}, walk = walkFlow(lib, fid, answers);
      for (const qid of walk.path) {
        const q = f.questions[qid], a = answers[qid];
        if (a === 'yes' && q.note_yes) positives.push(q.note_yes);

        else if (!known(a) || a === 'unknown') gaps.push(`${f.name}: ${q.ask}`);
      }
      if (!walk.end) { incomplete.push(`${f.name}: questions not finished`); continue; }
      if (walk.end.kind === 'incomplete' || walk.end.kind === 'call-doctor') {
        const on = walkFlow(lib, fid, answers, true);
        for (const qid of on.unsure) gaps.push(`${f.name}: ${f.questions[qid].ask}`);
        if (['suggest', 'consult-specialist'].includes(on.end?.kind)) {
          const result = {f, end: on.end, bodyUnknown: on.uncertain.length > 0, unsure: on.unsure.map((qid) => f.questions[qid].ask)};
          (on.end.kind === 'suggest' ? suggested : consults).push(result);
          plans.push(result);
        } else if (walk.end.kind === 'incomplete') incomplete.push(`${f.name}: ${walk.end.say}`);
        continue;
      }
      if (walk.end.kind === 'unlikely') {
        if (walk.flags.length) incomplete.push(`${f.name}: not settled - a safety question was not known`);
        else unlikely.push(`${f.name}${pg(walk.end)}`);
        continue;
      }
      const result = {f, end: walk.end, bodyUnknown: walk.uncertain.length > 0};
      if (walk.end.kind === 'suggest') suggested.push(result);

          const item = measure.items.find((x) => x.id === danger.item_id), option = measure.response_options.find((x) => x.code === given[danger.item_id]);

      const translation = mark === 'ours' ? 'our translation, not validated' : mark === 'link-only' ? 'English items, holder translation link' : 'official translation';
      const total = scored.total === null ? 'question-by-question, no numeric total' : `total ${scored.total} of ${measure.scoring.range[1]}${scored.band ? ` (${measure.scoring.band_label || 'holder band'}: ${scored.band})` : ''}`;
      const simple = measure.items.every((item) => item.simple) ? (measure.wording?.status === 'reminder' ? '; simple wording read aloud' : '; simple wording read aloud, official wording on screen') : '';
      const wording = measure.wording?.status === 'reminder' ? '; short reminders of the items, not the official wording' : '';
      const credit = String(measure.credit_line || '').replace(/[.\s]+$/, '');
      screenings.push(`${measure.name} ${total}.`);
      credits.push(`${measure.name} ${total} - ${credit}; ${wording ? `${language}${wording}` : scored.language === 'en' ? 'English original' : `${language}, ${translation}`}${simple}`);
      for (const danger of measure.danger_items || []) {
        const answer = scored.answers[danger.item_id];
        if (answer === undefined) continue;
        const item = measure.items.find((x) => x.id === danger.item_id), option = measure.response_options.find((x) => x.code === answer);
        screenings.push(`${measure.name} item ${measure.items.indexOf(item) + 1}: "${item.text.en}" - answer: ${option.text.en}`);

    writeSection('History of present illness:', [...hpi, ...positives], negatives);
    if (screenings.length) out.push('Screening questionnaires (screening only, not a diagnosis):', ...screenings);
    writeSection('Past psychiatric history:', sectionSentences('past'));
    writeSection('Medical history and current medicines:', sectionSentences('health'));
    writeSection('Substance use:', sectionSentences('substances'));
    writeSection('Family history:', sectionSentences('family'));
    writeSection('Personal and social history:', sectionSentences('social'));
    writeSection('Risk:', risk.filter((s) => !/^No /.test(s)), risk.filter((s) => /^No /.test(s)));
    const mse = [];
    for (const item of lib.mse || []) {
      const v = record.mse?.[item.id];
      if (known(v)) mse.push(sentence(item, v)); else gaps.push(item.label);
    }
    writeSection('Mental state (staff observations):', mse);
    out.push('', 'Differentials to consider (not a diagnosis until the doctor confirms):');
    if (!differential.length) out.push('None suggested from these answers.');
    // Part 1 names each condition; a consult ending keeps its reason. Codes and rule-outs go to the reference part.
    differential.forEach(({end,bodyUnknown,unsure}, i) => {
      const lead = end.name ? (end.kind === 'suggest' ? `${end.name} (suggested)` : `${end.name} (needs doctor assessment): ${end.say}`) : end.kind === 'suggest' ? end.say : `Needs doctor assessment: ${end.say}`;
      out.push(`${i + 1}. ${lead}${pg(end)}${bodyUnknown ? ` — ${lib.note.body_cause_unknown || 'Doctor to rule out body causes'}` : ''}${unsure?.length ? ` — not settled: ${unsure.map((q) => `"${q}"`).join(', ')} was not known` : ''}`);

    for (const s of incomplete) out.push(`- Doctor to assess: ${s}`);
    if (unlikely.length) out.push(`Less likely: ${unlikely.join('; ')}`);
    out.push('', 'Management options from mhGAP and NICE/WHO guidelines, for the doctor to decide:');

    // Part 1 writes each condition's options as short sentences, one per source page; doses, cautions and
    // "refer when" sit in the reference part.
    const lower = (t) => /^[A-Z][a-z]/.test(t) ? t.charAt(0).toLowerCase() + t.slice(1) : t;

      const runs = [];
      for (const p of items) { const last = runs[runs.length - 1]; if (last && pg(last[0]) === pg(p)) last.push(p); else runs.push([p]); }

    };
    for (const {f,end} of plans) {

      const plan = end.plan || f.plan;

      const meds = [...(plan.medicine_options || []), ...(plan.medicine_named || [])];

        reference.push('Medicine options, for the doctor to decide:');
        for (const p of plan.medicine_caution || []) reference.push(`- Caution: ${p.text}${pg(p)}`);
        for (const p of plan.medicine_options || []) reference.push(`- ${p.name}: ${p.dose_as_in_mhgap}${pg(p)}`, `  ${caution(p)}`);
        for (const p of plan.medicine_named || []) reference.push(`- ${p.name}: ${p.text} (dose: ${p.dose})${pg(p)}`);

      ...(credits.length ? ['', 'Questionnaire sources:', ...credits] : []),

  const storageKey = 'fcm.history.v0';
  let original = null;
  try { original = localStorage.getItem(storageKey); } catch {}
  const lines = [];
  let passed = 0;
  const tap = (action) => {
    const button = document.querySelector(`[data-h="${action}"]`);
    if (!button) throw new Error(`${action} missing`);
    button.click();
  };
  const fill = (selector, value) => {
    const input = document.querySelector(selector);
    if (!input) throw new Error(`${selector} missing`);
    input.value = value;
    input.dispatchEvent(new Event('input', { bubbles: true }));
    input.dispatchEvent(new Event('change', { bubbles: true }));
  };
  const note = () => document.querySelector('[data-h-screen="note"]')?.textContent || '';
  function start(label) {
    window.HistoryApp.reset();
    fill('[data-field="role"]', 'psychologist');
    fill('[data-field="patient"]', label);
    fill('[data-field="historian"]', 'patient');
    tap('start');
  }
  function dangers(yes) {
    for (const item of window.HISTORY_LIBRARY.danger) {
      if (item.id === yes) {
        tap('danger-yes');
        if (!document.querySelector('[data-h-screen="call"]')) throw new Error('call screen did not appear at once');
        if (!document.querySelector('[data-h-screen="call"]').textContent.includes(item.ask)) throw new Error('call item missing');
        tap('called');
      } else tap('danger-no');
    }
  }
  function throughInterview(unknown = false) {
    for (let i = 0; i < window.HISTORY_LIBRARY.interview.length; i++) {
      if (unknown) for (const select of document.querySelectorAll('select[data-interview]')) {
        if (select.querySelector('option[value="unknown"]')) fill(`[data-interview="${select.dataset.interview}"]`, 'unknown');
      }
      tap('next-interview');
    }
  }
  function choosePresentation(id) {
    const box = document.querySelector(`[data-presentation="${id}"]`);
    if (!box) throw new Error(`${id} missing`);
    box.click();
    tap('next-presentations');
  }
  function finish() { tap('note'); if (!note()) throw new Error('draft note missing'); }
  function run(name, task) {
    try { task(); passed++; lines.push(`PASS ${name}`); }
    catch (error) { lines.push(`FAIL ${name}: ${error.message}`); }
  }
  run('depression suggestion with no danger', () => {
    start('Patient A'); dangers(null); throughInterview(); choosePresentation('pr.depression');
    const answers = { low_mood: 'yes', additional: 'yes', function: 'yes', physical: 'no', mania: 'no', loss: 'no', self_harm: 'no' };
    for (const [question, answer] of Object.entries(answers)) {
      if (!document.querySelector('[data-h-screen="flow"]')) throw new Error(`${question} flow screen missing`);
      const flow = window.HistoryApp.snapshot();
      if (flow.flowQuestion !== question) throw new Error(`expected ${question}, got ${flow.flowQuestion}`);
      tap(`flow-${answer}`);
    }
    finish();
    if (!note().includes('depression') || note().includes('CALL THE DOCTOR NOW')) throw new Error('suggestion or call line wrong');
  });
  run('danger interrupts immediately and stays in note', () => {
    start('Patient B'); dangers('danger.self-harm'); throughInterview(); tap('next-presentations'); finish();
    if (!note().includes('CALL THE DOCTOR NOW')) throw new Error('call line missing from note');
  });
  run('not sure shows the missing answer in the note', () => {
    start('Patient C');
    for (const item of window.HISTORY_LIBRARY.danger) {
      tap('danger-unknown');
      if (!document.querySelector('[data-h-screen="call"]')?.textContent.includes(item.ask)) throw new Error('uncertain danger did not call');
      tap('called');
    }
    throughInterview(true); choosePresentation('pr.depression'); tap('flow-unknown'); finish();
    if (!note().includes('CALL THE DOCTOR NOW') || !note().includes('Not asked or not answered') || !note().includes('Has your mood felt low')) throw new Error('call or gap not listed');
  });
  run('a new patient label at Start does not carry the last patient answers', () => {
    start('Patient D'); dangers(null); fill('[data-interview="language"]', 'PATIENT-D-ONLY'); tap('next-interview');
    for (let i = 0; i < 20 && !document.querySelector('[data-field="patient"]'); i++) tap('back');
    if (!document.querySelector('[data-field="patient"]')) throw new Error('did not get back to start');
    fill('[data-field="patient"]', 'Patient E'); tap('start'); dangers(null); throughInterview(); tap('next-presentations'); finish();
    if (note().includes('PATIENT-D-ONLY')) throw new Error("Patient D's answer appeared in Patient E's note");
    if (!note().includes('Patient: Patient E')) throw new Error('note does not name the patient');
  });
  run('questions from sources other than mhGAP show their source and section', () => {
    start('Patient F'); dangers(null); throughInterview(); choosePresentation('pr.worry-fear');
    const shown = document.querySelector('.history-source')?.textContent || '';
    if (/undefined/.test(shown) || !/Recognition and assessment/.test(shown)) throw new Error(`source shown as "${shown}"`);
  });
  lines.push(`SELFTEST ${passed}/${lines.length}`);
  output.textContent = lines.join('\n');
  try { if (original === null) localStorage.removeItem(storageKey); else localStorage.setItem(storageKey, original); } catch {}
})();

}</script>
