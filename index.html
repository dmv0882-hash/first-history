<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>First history</title>
  <style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; font: 17px/1.5 system-ui,sans-serif; color: #17293d; background: #f4f7fc; }
button, input, textarea { font: inherit; }
button { min-height: 48px; cursor: pointer; border: 2px solid #ccd5e3; border-radius: 16px; background: white; color: #17293d; padding: 10px 16px; text-align: left; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid #074db8; outline-offset: 2px; }
button:disabled { opacity: .55; cursor: default; }
h1,h2,p { margin-top: 0; }
h1 { font-size: 1.75rem; line-height: 1.2; }
h2 { font-size: 1.15rem; line-height: 1.3; }
small { font-size: .9rem; }
header { padding: 14px 16px; background: #fff; border-bottom: 1px solid #dbe3ee; }
.topline { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.topline small { color: #526177; text-align: right; max-width: 165px; }
nav { display: flex; gap: 8px; margin-top: 10px; }
nav button { padding: 8px 10px; flex: 1; text-align: center; }
nav button.active { background: #123e88; color: white; border-color: #123e88; }
main { max-width: 780px; margin: 0 auto; padding: 20px 16px 112px; }
.intro { padding: 8px 2px 12px; }
.intro p, .step-head p { color: #34465f; }
.patient-grid, .end-grid { display: grid; gap: 12px; }
.patient-tile, .question-tile, .ending-tile, .summary-group, .step-head, .result-card, .call-body { background: #fff; border: 1px solid #dbe3ee; border-radius: 20px; padding: 18px; box-shadow: 0 2px 8px #17293d0b; }
.patient-tile.selected { border: 2px solid #123e88; }
.tile-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.patient-button { flex: 1; font-size: 1.08rem; font-weight: 700; border: none; background: none; padding: 8px 0; }
.ward-chip { background: #e9eff8; color: #213d61; border-radius: 30px; padding: 5px 10px; white-space: nowrap; }
.hint { margin: 12px 0 5px; font-weight: 700; }
.chips, .options { display: grid; gap: 8px; }
.chips { grid-template-columns: repeat(2, minmax(0,1fr)); }
.chips button { font-size: .94rem; }
.chosen { border-color: #123e88; background: #e2edff; box-shadow: inset 0 0 0 1px #123e88; }
.tile-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
.open-button { border: none; color: #123e88; font-weight: 700; }
.actions { display: grid; gap: 10px; margin-top: 20px; }
.primary { background: #123e88; border-color: #123e88; color: #fff; font-weight: 700; text-align: center; }
.secondary { background: #fff; font-weight: 700; text-align: center; }
.step-head { margin-bottom: 14px; }
.step-head small { color: #4c6079; }
.step-head h1 { margin: 8px 0; }
.why { margin-top: 12px; border-top: 1px solid #dbe3ee; padding-top: 10px; }
.why summary { cursor: pointer; font-weight: 700; color: #123e88; min-height: 48px; display: flex; align-items: center; }
.why small { display: block; color: #465872; }
.question-tile { margin: 12px 0; }
.question-tile h2 { margin-bottom: 14px; }
.danger-band { background: #8a2030; border-radius: 18px; color: #fff; padding: 16px; font-weight: 800; margin: 16px 0; }
.danger-tile { border-left: 6px solid #8a2030; }
.danger-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.danger-actions button:last-child { grid-column: 1 / -1; }
.danger-actions .yes { border-color: #8a2030; color: #70202c; font-weight: 700; }
.danger-actions .yes.chosen { background: #8a2030; color: #fff; }
.ending-tile p { margin: 6px 0 0; }
.ending-button { width: 100%; font-weight: 700; }
.result-card { border-top: 9px solid #123e88; }
.result-card.today { border-top-color: #a35a00; }
.result-card.find, .result-card.retry { border-top-color: #784d8b; }
.result-card ul { padding-left: 24px; }
.summary-group { margin: 12px 0; }
.summary-line { border-top: 1px solid #dbe3ee; padding-top: 12px; margin-top: 12px; }
.summary-line p { margin: 6px 0; }
.summary-line ol { padding-left: 22px; }
.call-screen { border-radius: 22px; overflow: hidden; }
.call-band { background: #8a2030; color: #fff; padding: 22px; }
.call-screen[data-kind="rights"] .call-band { background: #194b78; }
.call-icon { display: inline-grid; place-items: center; background: #fff; color: #8a2030; width: 54px; height: 54px; border-radius: 50%; font-size: 1.6rem; margin-bottom: 12px; }
.rights-band { background: #fff; color: #194b78; border-radius: 12px; padding: 12px; font-weight: 700; }
.call-body { border-radius: 0 0 22px 22px; }
.escalate-banner { border: 3px solid #8a2030; background: #fff0ee; color: #6c1926; border-radius: 14px; padding: 12px; margin: 12px 0; }
.escalate-banner p { margin: 4px 0 0; }
.call-events { display: grid; gap: 8px; margin: 18px 0; }
.event-row { display: grid; grid-template-columns: 30px 1fr; align-items: center; gap: 8px; }
.event-row button { text-align: left; }
.event-row small { grid-column: 2; }
.event-num { font-weight: 800; }
label { display: block; font-weight: 700; margin: 14px 0; }
input, textarea { display: block; width: 100%; min-height: 48px; border: 2px solid #7b8da5; border-radius: 12px; padding: 9px; background: #fff; color: #17293d; }
.notice { background: #fff1d6; border-radius: 12px; padding: 12px; }
footer { position: sticky; bottom: 0; display: flex; gap: 8px; padding: 10px 16px; background: #fff; border-top: 1px solid #dbe3ee; }
footer button { flex: 1; }
.history-main { max-width: 700px; }
.history-hint { color: #34465f; }
.history-source { display: block; color: #526177; font-weight: 400; margin: 4px 0 8px; }
.history-main select { display: block; width: 100%; min-height: 48px; border: 2px solid #7b8da5; border-radius: 12px; padding: 9px; background: #fff; color: #17293d; font: inherit; }
.history-main select:focus-visible { outline: 3px solid #074db8; outline-offset: 2px; }
.history-choice { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid #dbe3ee; }
.history-choice input { width: 24px; min-height: 24px; height: 24px; flex: none; margin: 3px 0 0; }
.history-choice span { flex: 1; }
.history-call { background: #8a2030; color: white; padding: 22px; border-radius: 20px; min-height: calc(100dvh - 190px); }
.history-call .history-source { color: #fff; }
.history-call-page { max-width: none; }
.history-banner { background: #fff1d6; color: #17293d; border-left: 6px solid #a35a00; border-radius: 12px; padding: 14px; font-weight: 800; margin-bottom: 16px; }
.history-note { white-space: pre-wrap; overflow-wrap: anywhere; font: 16px/1.55 system-ui,sans-serif; background: #fff; border: 1px solid #dbe3ee; border-radius: 16px; padding: 18px; }
.history-coach { margin: 14px 0; padding: 14px; border: 1px solid #9aabc1; border-radius: 16px; background: #eef5ff; }
.history-coach summary { cursor: pointer; font-weight: 800; min-height: 48px; display: flex; align-items: center; }
.history-language { display: flex; flex-wrap: wrap; gap: 8px; }
.history-language button { flex: 1 1 90px; min-height: 48px; text-align: center; }
.history-language button.active { background: #123e88; color: white; border-color: #123e88; }
.history-script { font-size: 1.08rem; font-weight: 700; overflow-wrap: anywhere; }
.history-main label { display: block; margin-bottom: 16px; }
.history-main label.history-choice { display: flex; }
.history-main textarea, .history-main input[type="text"], .history-main input[data-field="patient"] { max-width: 100%; box-sizing: border-box; }
.history-stages { display: flex; overflow-x: auto; gap: 4px; padding-top: 10px; scrollbar-width: thin; }
.history-stage { display: flex; align-items: center; gap: 3px; flex: 0 0 auto; padding: 4px 7px; border-radius: 10px; color: #526177; font-size: .75rem; }
.history-stage.done { color: #176352; }
.history-stage.current { color: #fff; background: #123e88; font-weight: 800; }
.history-icon { width: 24px; height: 24px; flex: 0 0 24px; vertical-align: middle; margin-right: 5px; }
.history-stage .history-icon { width: 17px; height: 17px; flex-basis: 17px; margin: 0; }
.history-signpost { padding: 12px 15px; margin-bottom: 18px; border-left: 4px solid #123e88; background: #e8f0ff; border-radius: 9px; }
.history-signpost p { margin: 4px 0 0; }
.history-pinned { margin-top: 6px; background: #fff0ee; color: #7b1d29; border: 1px solid #9e2538; border-radius: 8px; padding: 5px 9px; font-size: .79rem; font-weight: 800; }
.history-caution { color: #526177; font-size: .78rem; margin: 4px 0 14px; }
.history-route { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 8px; margin: 10px 0; border: 1px solid #dbe3ee; border-radius: 12px; font-size: .82rem; }
.history-route span { display: inline-flex; align-items: center; gap: 4px; background: #eef5ff; border-radius: 8px; padding: 5px 8px; }
.history-route .history-icon { width: 18px; height: 18px; flex-basis: 18px; margin: 0; }
.history-checklist fieldset { border: 1px solid #dbe3ee; border-radius: 14px; margin: 13px 0; padding: 14px; }
.history-checklist legend { font-size: 1.15rem; font-weight: 800; padding: 0 6px; }
.history-answer-row { display: flex; flex-wrap: wrap; gap: 8px; }
.history-answer-row label { display: flex; align-items: center; gap: 5px; margin: 0; padding: 6px; border: 1px solid #ccd5e3; border-radius: 9px; }
.history-answer-row input { width: 20px; height: 20px; min-height: 20px; margin: 0; }
.history-call h2 { font-size: 1.7rem; }
.history-main h1, .history-main .step-head h2, .history-checklist legend { text-align: center; }
.history-main .step-head h2 { font-size: 1.42rem; margin: 18px 0; }
.history-call li { margin: 0 0 18px; }
.history-answer-path { margin-top: 15px; }
.history-answer-path summary { cursor: pointer; font-weight: 800; }
@media print { .history-answer-path { display: none; } }
.history-reference { margin-top: 15px; border-top: 2px dashed currentColor; padding-top: 10px; }
.history-reference summary { cursor: pointer; font-weight: 800; }
.history-reference .history-note { font-size: 0.9em; opacity: 0.85; }
@media (max-width: 430px) { .history-main { padding-top: 16px; } .history-main h1 { font-size: 1.5rem; } .history-main + footer { flex-wrap: wrap; } .history-main + footer button { min-width: 42%; } }
@media print { header, footer, .history-hint, .history-coach { display: none !important; } body { background: white; } main { padding: 0; max-width: none; } .history-note { border: 0; padding: 0; } }
@media (min-width: 650px) { .patient-grid { grid-template-columns: 1fr 1fr; } }
/* Slice 3: a Call doctor button that stays in reach on every screen, and tick boxes in place of drop-down lists. */
.history-call-now { flex: none; min-height: 44px; padding: 8px 14px; border-radius: 999px; background: #8a2030; border-color: #8a2030; color: #fff; font-weight: 800; text-align: center; }
.history-field { border: 0; padding: 0; margin: 0 0 20px; min-width: 0; }
.history-field legend { font-weight: 700; padding: 0; margin-bottom: 4px; }
.history-field .history-answer-row label { min-height: 44px; padding: 8px 12px; font-weight: 600; }
.history-field .history-answer-row label:has(input:checked) { background: #e2edff; border-color: #123e88; }
.history-field textarea { margin-top: 8px; min-height: 44px; }
@media print { .history-call-now { display: none !important; } }
/* Slice 4: English small above, the patient's language big below; questionnaire official wording small and labelled. */
.history-say-en { display: block; margin: 8px 0 0; font-size: .86rem; font-weight: 500; color: #4a5a70; overflow-wrap: anywhere; }
.history-say-en + .history-script, .history-script:not(:lang(en)) { font-size: 1.3rem; line-height: 1.45; margin-top: 2px; }
.history-measure-main { display: block; font-size: 1.15rem; font-weight: 700; line-height: 1.45; }
.history-measure-main:not(:lang(en)) { font-size: 1.3rem; }
.history-official { display: block; margin-top: 4px; font-size: .8rem; font-weight: 400; color: #4a5a70; }
/* Slice 5 (Divyam, 2026-10-10: "mobile-first"): a slim header with Call doctor stays at the top; every answer is a
   tile at least 48px tall; the step strip scrolls with the page. Checked by the phone-layout line of ?selftest. */
header:has(+ .history-main) { position: sticky; top: 0; z-index: 10; padding: 8px 16px; }
header .topline { align-items: center; }
.history-title { display: flex; flex-direction: column; min-width: 0; }
.history-title small { font-size: .74rem; color: #526177; }
.history-main .history-stages { margin: -6px -16px 12px; padding: 0 16px 6px; }
.history-answer-row label { min-height: 48px; padding: 8px 12px; font-weight: 600; cursor: pointer; }
.history-answer-row label:has(input:checked) { background: #e2edff; border-color: #123e88; box-shadow: inset 0 0 0 1px #123e88; }
.history-answer-row input { width: 22px; height: 22px; min-height: 22px; flex: none; }
.history-checklist .history-answer-row label { flex: 1 1 0; justify-content: center; }
.history-measure .history-answer-row { display: grid; grid-template-columns: 1fr; gap: 6px; }
.history-answer-path summary, .history-reference summary { min-height: 48px; display: flex; align-items: center; }
.history-measure-links a { display: inline-flex; align-items: center; min-height: 44px; }
@media (max-width: 430px) {
  .history-main + footer { flex-wrap: wrap; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); }
  .history-main + footer button:not([data-h="back"]) { flex: 1 1 0; }
  .history-main + footer:has(> button:nth-child(3)) button.primary { flex-basis: 100%; order: 3; }
  .history-main + footer button { min-width: 0; text-align: center; padding-inline: 8px; font-size: .94rem; }
  .history-main + footer button[data-h="back"] { flex: 0 0 auto; }
}

</style>

post":{"next":"Ask about earlier difficulties and physical health: 9 questions; about 3 minutes.","say":{"en":"Now I will ask about your health. Has anything like this happened before?","hi":"अब हम आपकी सेहत के बारे में पूछेंगे। क्या ऐसा पहले भी हुआ है?","gu":"હવે હું તમારી તબિયત વિશે પૂછીશ. શું આવું પહેલાં પણ થયું છે?"}}},{"id":"family-life","label":"Family and life","items":["family","social"],"signpost":{"next":"Ask about family and everyday life: 6 questions; about 2 minutes.","say":{"en":"Let us talk about life at home. Who is around you? Who helps you?","hi":"घर में आपकी ज़िंदगी कैसी है? आपके आसपास कौन है? आपकी मदद कौन करता है?","gu":"ઘરે તમારું જીવન કેવું છે? તમારી આસપાસ કોણ છે? તમને કોણ મદદ કરે છે?"}}},{"id":"safety","label":"Safety","items":["glance","ask_danger","screens"],"signpost":{"next":"Tick any of 5 signs you saw, then ask 3 personal safety questions and review any suggested forms; about 3 to 5 minutes.","say":{"en":"I ask everyone a few personal questions about safety. You can tell me honestly how things are.","hi":"हम सबसे सुरक्षा के बारे में कुछ निजी सवाल पूछते हैं। आप सच-सच बता सकते हैं कि हालात कैसे हैं।","gu":"હું દરેકને સલામતી વિશે થોડા અંગત સવાલ પૂછું છું. તમે સાચું કહી શકો છો કે હાલ શું ચાલી રહ્યું છે."}}},{"id":"observe","label":"Observe","items":["mse"],"signpost":{"next":"Record a few observations from the conversation; about 1 minute, with no new patient questions.","say":{"en":"We are nearly done. I will write down what I noticed as we talked.","hi":"हमारी बात लगभग पूरी हो गई है। बात करते समय हमने जो देखा, उसे लिखेंगे।","gu":"આપણી વાત લગભગ પૂરી થઈ છે. વાત કરતી વખતે મેં જે જોયું તે હું લખીશ."}}},{"id":"note","label":"Note","items":["note"],"signpost":{"next":"Review the draft with the doctor; no new questions, about 1 minute. Call first if a safety flag was found.","say":{"en":"Thank you for telling me. The doctor will go over these notes with you. Then the doctor will decide what happens next.","hi":"मुझे बताने के लिए शुक्रिया। डॉक्टर leasure for at least two weeks.","note_no":"No loss of interest or pleasure."},"additional":{"ask":"Have several other changes lasted through those two weeks?","help":"For example, sleep, appetite, energy, focus or feelings of worthlessness; record each in the history.","page":22,"source_id":"who-mhgap","yes":"function","no":"end:unlikely","coach":{"how":"Ask calmly; allow time for the answer.","say":{"en":"Can I ask more about how you feel and your daily life? Take your time.","hi":"आपको कैसा लग रहा है और रोज़ की ज़िंदगी कैसी चल रही है? क्या हम इस बारे में और पूछ सकते हैं? आराम से बताइए।","gu":"તમને કેવું લાગે છે અને તમારું રોજનું જીવન કેવું ચાલે છે, તે વિશે શું હું વધુ પૂછી શકું? આરામથી કહો."},"page":6,"source_id":"who-mhgap"},"note_yes":"Other depressive symptoms (such as sleep, appetite, energy, concentration or worthlessness) over the same two weeks.","note_no":"No other depressive symptoms were reported over those two weeks."},"function":{"ask":"Have these changes made everyday life much harder?","help":"For example, struggling at home, work or with other people.","page":22,"source_id":"who-mhgap","yes":"physical","no":"end:unlikely","coach":{"how":"Ask calmly; allow time for the answer.","say":{"en":"Can I ask more about how you feel and your daily life? Take your time.","hi":"आपको कैसा लग रहा है और रोज़ की ज़िंदगी कैसी चल रही है? क्या हम इस बारे में और पूछ सकते हैं? आराम से बताइए।","gu":"તમને કેવું લાગે છે અને તમારું રોજનું જીવન કેવું ચાલે છે, તે વિશે શું હું વધુ પૂછી શકું? આરામથી કહો."},"page":6,"source_id":"who-mhgap"},"note_yes":"Everyday life has become much harder.","note_no":"Everyday life is reported to be managed as usual."},"physical":{"ask":"Is there a possible physical explanation for these changes?","help":"For example, a thyroid problem or a new medicine; the doctor must review this.","page":23,"source_id":"who-mhgap","yes":"end:physical_review","no":"mania","coach":{"how":"Ask calmly; allow time for the answer.","say":{"en":"Can I ask more about how you feel and your daily life? Take your time.","hi":"आपको कैसा लग रहा है और रोज़ की ज़िंदगी कैसी चल रही है? क्या हम इस बारे में और पूछ सकते हैं? आराम से बताइए।","gu":"તમને કેવું લાગે છે અને તમારું રોજનું જીવન કેવું ચાલે છે, તે વિશે શું હું વધુ પૂછી શકું? આરામથી કહો."},"page":6,"source_id":"who-mhgap"},"note_yes":"A possible physical or medicine cause was reported; doctor to review.","note_no":"No physical illness or medicine was reported that could explain these changes."},"mania":{"ask":"Was there a past week-long spell of unusually changed mood and energy?","help":"For example, unusually high or irritable mood with much less need for sleep.","page":24,"source_id":"who-mhgap","yes":"mania_impact","no":"loss","coach":{"how":"Ask calmly; allow time for the answer.","say":{"en":"Can I ask more about how you feel and your daily life? Take your time.","hi":"आपको कैसा लग रहा है और रोज़ की ज़िंदगी कैसी चल रही है? क्या हम इस बारे में और पूछ सकते हैं? आराम से बताइए।","gu":"તમને કેવું લાગે છે અને તમારું રોજનું જીવન કેવું ચાલે છે, તે વિશે શું હું વધુ પૂછી શકું? આરામથી કહો."},"page":6,"source_id":"who-mhgap"},"note_yes":"A past spell of a week or more of unusually high or irritable mood with more energy.","note_no":"No past spell of unusually high or irritable mood."},"mania_impact":{"ask":"Did that period seriously disrupt everyday life?","help":"For example, serious trouble at work or admission to hospital.","page":24,"source_id":"who-mhgap","yes":"end:bipolar","no":"loss","coach":{"how":"Ask calmly; allow time for the answer.","say":{"en":"Can I ask more about how you feel and your daily life? Take your time.","hi":"आपको कैसा लग रहा है और रोज़ की ज़िंदगी कैसी चल रही है? क्या हम इस बारे में और पूछ सकते हैं? आराम से बताइए।","gu":"તમને કેવું લાગે છે અને તમારું રોજનું જીવન કેવું ચાલે છે, તે વિશે શું હું વધુ પૂછી શકું? આરામથી કહો."},"page":6,"source_id":"who-mhgap"},"note_yes":"That spell seriously disrupted everyday life.","note_no":"That spell did not seriously disrupt everyday life."},"loss":{"ask":"Did a major loss happen in the last six months?","help":"For example, a death in the family.","page":24,"source_id":"who-mhgap","yes":"loss_warning","no":"self_harm","coach":{"how":"Ask calmly; allow time for the answer.","say":{"en":"Can I ask more about how you feel and your daily life? Take your time.","hi":"आपको कैसा लग रहा है और रोज़ की ज़िंदगी कैसी चल रही है? क्या हम इस बारे में और पूछ सकते हैं? आराम से बताइए।","gu":"તમને કેવું લાગે છે અને તમારું રોજનું જીવન કેવું ચાલે છે, તે વિશે શું હું વધુ પૂછી શકું? આરામથી કહો."},"page":6,"source_id":"who-mhgap"},"note_yes":"A major loss within six months.","note_no":"No major loss within six months reported."},"loss_warning":{"ask":"Since that loss, have you felt worthless?","help":"For example, believing you have no value; also record other guide warning signs.","page":25,"source_id":"who-mhgap","yes":"self_harm","no":"loss_psychosis","coach":{"how":"Ask calmly; allow time for the answer.","say":{"en":"Can I ask more about how you feel and your daily life? Take your time.","hi":"आपको कैसा लग रहा है और रोज़ की ज़िंदगी कैसी चल रही है? क्या हम इस बारे में और पूछ सकते हैं? आराम से बताइए।","gu":"તમને કેવું લાગે છે અને તમારું રોજનું જીવન કેવું ચાલે છે, તે વિશે શું હું વધુ પૂછી શકું? આરામથી કહો."},"page":6,"source_id":"who-mhgap"},"note_yes":"Worthlessness after the loss.","note_no":"No worthlessness after the loss reported."},"loss_psychosis":{"ask":"Since that loss, have you had an unusual perception?","help":"For example, hearing speech when no one is speaking.","page":25,"source_id":"who-mhgap","yes":"end:psychotic","no":"loss_slowing","coach":{"how":"Ask calmly; allow time for the answer.","say":{"en":"Can I ask more about how you feel and your daily life? Take your time.","hi":"आपको कैसा लग रहा है और रोज़ की ज़िंदगी कैसी चल रही है? क्या हम इस बारे में और पूछ सकते हैं? आराम से बताइए।","gu":"તમને કેવું લાગે છે અને તમારું રોજનું જીવન કેવું ચાલે છે, તે વિશે શું હું વધુ પૂછી શકું? આરામથી કહો."},"page":6,"source_id":"who-mhgap"},"note_yes":"Unusual perception after the loss.","note_no":"No unusual perception after the loss reported."},"loss_slowing":{"ask":"Since that loss, have you been noticeably slower than usual?","help":"For example, unusually slow speech or movement.","page":25,"source_id":"who-mhgap","yes":"self_harm","no":"loss_past","coach":{"how":"Ask calmly; allow time for the answer.","say":{"en":"Can I ask more about how you feel and your daily life? Take your time.","hi":"आपको कैसा लग रहा है और रोज़ की ज़िंदगी कैसी चल रही है? क्या हम इस बारे में और पूछ सकते हैं? आराम से बताइए।","gu":"તમને કેવું લાગે છે અને તમારું રોજનું જીવન કેવું ચાલે છે, તે વિશે શું હું વધુ પૂછી શકું? આરામથી કહો."},"page":6,"source_id":"who-mhgap"},"note_yes":"Noticeable slowing after the loss.","note_no":"No noticeable slowing after the loss reported."},"loss_past":{"ask":"Have you had a similar depressive period before this loss?","help":"For example, a past episode that needed care.","page":25,"source_id":"who-mhgap","yes":"self_harm","no":"end:other","coach":{"how":"Ask calmly; allow time for the answer.","say":{"en":"Can I ask more about how you feel and your daily life? Take your time.","hi":"आपको कैसा लग रहा है और रोज़ की ज़िंदगी कैसी चल रही है? क्या हम इस बारे में और पूछ सकते हैं? आराम से बताइए।","gu":"તમને કેવું લાગે છે અને તમારું રોજનું જીવન કેવું ચાલે છે, તે વિશે શું હું વધુ પૂછી શકું? આરામથી કહો."},"page":6,"source_id":"who-mhgap"},"note_yes":"A similar low-mood period before the loss.","note_no":"No similar low-mood period before the loss reported."},"self_harm":{"ask":"Are you thinking of harming yourself now?","help":"For example, thoughts of ending your life today.","page":25,"source_id":"who-mhgap","yes":"end:doctor","no":"end:depression","coach":{"how":"Warn first, normalise and ask directly without judgment.","say":{"en":"I ask everyone this. When life feels very hard, some people think of hurting themselves. Have you thought about hurting yourself?","hi":"हम यह सवाल सबसे पूछते हैं। जब ज़िंदगी बहुत कठिन लगती है, कुछ लोग खुद को चोट पहुँचाने की सोचते हैं। क्या आपने खुद को चोट पहुँचाने की सोची है?","gu":"હું આ સવાલ દરેકને પૂછું છું. જીવન બહુ મુશ્કેલ લાગે ત્યારે કેટલાક લોકો પોતાને ઈજા પહોંચાડવાનું વિચારે છે. શું તમે પોતાને ઈજા પહોંચાડવાનું વિચાર્યું છે?"},"page":138,"source_id":"who-mhgap"},"note_yes":"Current thoughts of self-harm.","note_no":"No current thoughts of self-harm reported."}},"ends":{"unlikely":{"kind":"unlikely","say":"The guide's depression pattern is not shown by these answers; assess other complaints.","page":22,"source_id":"who-mhgap"},"doctor":{"kind":"call-doctor","say":"Call the doctor now about a current self-harm concern.","page":25,"source_id":"who-mhgap"},"physical_review":{"kind":"consult-specialist","say":"Ask the doctor to check a possible physical or medicine cause before suggesting depression.","page":23,"source_id":"who-mhgap","codes_none":"A physical or medicine cause needs review before a mental condition is named.","plan":{"psychosocial":[],"medicine_options":[],"follow_up":[{"text":"Review after the doctor assesses the possible physical or medicine cause.","page":23,"source_id":"who-mhgap"}],"refer_when":[{"text":"Doctor to assess the physical or medicine cause before a mental health plan.","page":23,"source_id":"who-mhgap"}]},"name":"Low mood, physical or medicine cause not yet excluded"},"bipolar":{"kind":"consult-specialist","say":"Past high-energy periods may change the care plan. Ask the doctor to assess bipolar depression and seek specialist advice.","page":26,"source_id":"who-mhgap","codes":{"icd11":[["6A60","Bipolar type I disorder"],["6A61","Bipolar type II disorder"]],"icd10":[["F31","Bipolar affective disorder"]],"dsm5tr":["Bipolar I disorder","Bipolar II disorder"]},"plan":{"psychosocial":[{"text":"Explain the condition to the person and carers; reduce stress and strengthen social support.","page":26,"source_id":"who-mhgap"},{"text":"Support daily activities and routine while a specialist reviews.","page":26,"source_id":"who-mhgap"}],"medicine_options":[{"name":"LITHIUM","dose_as_in_mhgap":"Start 300 mg daily. Increase gradually every 7 days until target blood level reached (maximum 600-1200 mg daily). Monitor every 2-3 months. Route: p.o.","page":43,"caution_as_in_mhgap":"Use only where clinical and laboratory monitoring are available; check blood levels every 2-3 months. Do not use with severe cardiac or kidney disease. Dehydration and NSAIDs, ACE inhibitors, thiazide diuretics, metronidazole or tetracycline can raise lithium levels; toxicity can cause seizures, delirium, coma or death. Avoid mood stabilizers in pregnancy or breastfeeding if possible.","caution_page":"43","audience":"doctor-option","source_id":"who-mhgap"},{"name":"CARBAMAZEPINE","dose_as_in_mhgap":"Start 200 mg daily. Increase by 200 mg weekly to 400-600 mg daily in two divided doses (maximum 1200 mg daily). Route: p.o.","page":43,"caution_as_in_mhgap":"Do not use with a history of blood disorders, kidney, liver or cardiac disease. Watch for severe rash and low sodium; the dose may need adjustment after 2 weeks. It can reduce the effect of hormonal birth control and several other medicines; some antifungals and antibiotics can raise its levels. Avoid mood stabilizers in pregnancy or breastfeeding if possible.","caution_page":"43","audience":"doctor-option","source_id":"who-mhgap"},{"name":"SODIUM VALPROATE","dose_as_in_mhgap":"Start 500 mg daily. Increase slowly to 1000-2000 mg daily (maximum 60 mg/kg/day). Route: p.o","page":43,"caution_as_in_mhgap":"Use caution with known or suspected liver disease; monitor liver tests and platelets if possible. Carbamazepine lowers valproate levels and aspirin raises them. Avoid mood stabilizers in pregnancy or breastfeeding if possible. 2023 guideline: Do not use in women or girls of childbearing potential because exposure in the womb can cause birth defects and developmental disorders.","caution_page":"43; 2023 pp. 96, 98","source_id":"who-mhgap","audience":"doctor-option"}],"medicine_caution":[{"text":"Antidepressant only together with a mood stabiliser (lithium, carbamazepine or valproate); an antidepressant alone can trigger mania.","page":26,"source_id":"who-mhgap"},{"text":"If signs of mania appear, the antidepressant is stopped and the person returns at once.","page":26,"source_id":"who-mhgap"}],"follow_up":[{"text":"Offer regular follow-up.","page":26,"source_id":"who-mhgap"}],"refer_when":[{"text":"Consult a specialist; if none is available soon, the doctor follows depression care with a mood stabiliser.","page":26,"source_id":"who-mhgap"}]},"name":"Depressive episode in bipolar disorder"},"other":{"kind":"other-flow","say":"After a recent loss, these answers do not settle the cause. Continue with other complaints and doctor review.","page":25,"source_id":"who-mhgap","next_flow":"oth.other"},"depression":{"kind":"suggest","say":"Possible depression for the doctor to confirm after reviewing the full history.","page":25,"source_id":"who-mhgap","condition":"dep.depression","codes":{"icd11":[["6A70","Single episode depressive disorder"],["6A71","Recurrent depressive disorder"]],"icd10":[["F32","Depressive episode"],["F33","Recurrent depressive disorder"]],"dsm5tr":["Major depressive disorder"]},"plan":{"psychosocial":[{"text":"Explain the symptoms without blame and ask what support helps.","page":27,"source_id":"who-mhgap"},{"text":"Help plan one manageable daily activity and regular sleep and meals.","page":27,"source_id":"who-mhgap"},{"text":"Offer structured talking treatment only with a trained provider.","page":27,"source_id":"who-mhgap"}],"medicine_options":[{"name":"AMITRIPTYLINE","dose_as_in_mhgap":"Start 25 mg at bedtime. Increase by 25-50 mg per week to 100-150 mg daily (maximum 300 mg). Note: Minimum effective dose in adults is 75 mg.","page":29,"caution_as_in_mhgap":"Avoid with suicidal thoughts or plans: overdose may be fatal; if self-harm is imminent, limit supply and ask carers to hold and monitor it. Avoid in cardiac disease, seizure history, hyperthyroidism, urinary retention, narrow-angle glaucoma or untreated bipolar disorder. Avoid in older adults if possible; use lower doses in older or medically ill adults; do not use in children or adolescents. Avoid antidepressants in pregnancy or breastfeeding if possible. Stop if mania develops; do not combine with another antidepressant.","caution_page":"29-30","audience":"doctor-option","source_id":"who-mhgap"},{"name":"FLUOXETINE","dose_as_in_mhgap":"Start 10 mg daily for one week then 20 mg daily. If no response in 6 weeks, increase to 40 mg (maximum 80 mg).","page":29,"caution_as_in_mhgap":"Use caution with seizure history, aspirin or other anti-inflammatory drugs, tamoxifen, codeine or tramadol; avoid with warfarin and with another antidepressant. Watch for bleeding, low sodium and mania; stop if mania develops. Antidepressants may increase suicidal thoughts, especially in adolescents and young adults; for adolescents, check suicidal thoughts weekly for the first 4 weeks. If self-harm is imminent, limit supply and ask carers to hold and monitor it. Avoid antidepressants in pregnancy or breastfeeding if possible; specifically avoid fluoxetine when breastfeeding.","caution_page":"29-30","audience":"doctor-option","source_id":"who-mhgap"}],"follow_up":[{"text":"Arrange another review within one week and ask about self-harm at each contact.","page":30,"source_id":"who-mhgap"},{"text":"Review benefit and unwanted effects after any doctor-led medicine change.","page":30,"source_id":"who-mhgap"}],"refer_when":[{"text":"Seek specialist advice when unusual beliefs or perceptions accompany low mood.","page":22,"source_id":"who-mhgap"},{"text":"Seek specialist advice for a possible past manic episode.","page":26,"source_id":"who-mhgap"}]},"name":"Depression"},"psychotic":{"kind":"consult-specialist","say":"Ask the doctor and a specialist to assess unusual perceptions with low mood before cho story, aspirin or other anti-inflammatory drugs, tamoxifen, codeine or tramadol; avoid with warfarin and with another antidepressant. Watch for bleeding, low sodium and mania; stop if mania develops. Antidepressants may increase suicidal thoughts, especially in adolescents and young adults; for adolescents, check suicidal thoughts weekly for the first 4 weeks. If self-harm is imminent, limit supply and ask carers to hold and monitor it. Avoid antidepressants in pregnancy or breastfeeding if possible; specifically avoid fluoxetine when breastfeeding.","caution_page":"29-30","audience":"doctor-option","source_id":"who-mhgap"}],"follow_up":[{"text":"Arrange another review within one week and ask about self-harm at each contact.","page":30,"source_id":"who-mhgap"},{"text":"Review benefit and unwanted effects after any doctor-led medicine change.","page":30,"source_id":"who-mhgap"}],"refer_when":[{"text":"Seek specialist advice when unusual beliefs or perceptions accompany low mood.","page":22,"source_id":"who-mhgap"},{"text":"Seek specialist advice for a possible past manic episode.","page":26,"source_id":"who-mhgap"}]},"coach":{"how":"Ask calmly; allow time for the answer.","say":{"en":"Can I ask more about how you feel and your daily life? Take your time.","hi":"आपको कैसा लग रहा है और रोज़ की ज़िंदगी कैसी चल रही है? क्या हम इस बारे में और पूछ सकते हैं? आराम से बताइए।","gu":"તમને કેવું લાગે છે અને તમારું રોજનું જીવન કેવું ચાલે છે, તે વિશે શું હું વધુ પૂછી શકું? આરામથી કહો."},"page":6,"source_id":"who-mhgap"},"rule_out":[{"text":"Anaemia, malnutrition and hypothyroidism","page":23,"source_id":"who-mhgap"},{"text":"Substance effects and medicine side effects","page":23,"source_id":"who-mhgap"},{"text":"A past manic episode before treating a low-mood episode","page":26,"source_id":"who-mhgap"}]},"psy.psychosis":{"name":"Possible psychosis","module":"PSY","depth":"full","start":"physical","questions":{"physical":{"ask":"Is there a possible new physical cause for these chan ess.","note_no":"No acute physical illness reported."}},"ends":{"doctor":{"kind":"call-doctor","say":"Call the doctor now about a new physical illness or other acute danger.","page":35,"source_id":"who-mhgap"},"mania":{"kind":"other-flow","say":"Assess the current high-energy spell with the mania questions.","page":36,"source_id":"who-mhgap","next_flow":"psy.bipolar-mania"},"psychosis":{"kind":"suggest","say":"Two guide features are present. Ask the doctor to assess possible psychosis.","page":37,"source_id":"who-mhgap","condition":"psy.psychosis","codes":{"icd11":[["6A2Z","Schizophrenia or other primary psychotic disorders, unspecified"]],"icd10":[["F29","Unspecified nonorganic psychosis"]],"dsm5tr":["Unspecified schizophrenia spectrum and other psychotic disorder"]},"plan":{"psychosocial":[{"text":"Explain care and follow-up calmly to the person and carers.","page":40,"source_id":"who-mhgap"},{"text":"Support a regular sleep pattern and daily routines.","page":40,"source_id":"who-mhgap"}],"medicine_options":[{"name":"HALOPERIDOL","dose_as_in_mhgap":"Start 1.5-3 mg daily. Increase as needed (maximum 20 mg daily). Route: oral (p.o.) or intramuscular (i.m.).","page":42,"caution_as_in_mhgap":"Use caution with kidney, liver or cardiac disease, long QT syndrome or other QT-prolonging medicines; monitor ECG if possible.","caution_page":"42","audience":"doctor-option","source_id":"who-mhgap"},{"name":"RISPERIDONE","dose_as_in_mhgap":"Start 1 mg daily. Increase to 2-6 mg daily (maximum 10 mg). Route: p.o.","page":42,"caution_as_in_mhgap":"Use caution with cardiac disease. Carbamazepine can lower risperidone levels; fluoxetine can raise them.","caution_page":"42","audience":"doctor-option","source_id":"who-mhgap"},{"name":"CHLORPROMAZINE","dose_as_in_mhgap":"Start 25-50 mg daily. Increase to 75-300 mg daily (up to 1000 mg may be necessary for severe cases). Route: p.o.","page":42,"caution_as_in_mhgap":"Do not use with impaired consciousness, bone marrow depression or pheoch egnancy or breastfeeding; do not use in children or adolescents, or with impaired consciousness or parkinsonism. Use caution with cardiac, kidney or liver disease and in older adults. It may increase the effect of blood-pressure medicines and lower blood pressure with epinephrine.","caution_page":"42","audience":"doctor-option","source_id":"who-mhgap"}],"follow_up":[{"text":"During acute symptoms, check as often as needed, even daily.","page":46,"source_id":"who-mhgap"},{"text":"After improvement, review symptoms, daily life and any doctor-led treatment.","page":47,"source_id":"who-mhgap"}],"refer_when":[{"text":"Consult a specialist if the cause remains unclear.","page":37,"source_id":"who-mhgap"},{"text":"Seek specialist advice if medicines have not helped after adequate trials.","page":44,"source_id":"who-mhgap"}]},"coach":{"how":"Ask calmly; allow time for the answer.","say":{"en":"Can I ask more about what happened lately and what you did? Take your time.","hi":"क्या हम हाल में क्या हुआ और आपने क्या किया, इस बारे में और पूछ सकते हैं? आराम से बताइए।","gu":"શું હું હાલમાં શું થયું અને તમે શું કર્યું તે વિશે વધુ પૂછી શકું? આરામથી કહો."},"page":6,"source_id":"who-mhgap"},"rule_out":[{"text":"Delirium or another acute physical cause","page":36,"source_id":"who-mhgap"},{"text":"Substance or medicine effects","page":36,"source_id":"who-mhgap"},{"text":"A current manic episode","page":36,"source_id":"who-mhgap"}]},"psy.bipolar-mania":{"name":"Possible manic episode","module":"PSY","depth":"full","start":"physical","questions":{"physical":{"ask":"Is there a possible acute physical cause for the change?","help":"For example, fever, dehydration or a new medicine.","page":35,"source_id":"who-mhgap","yes":"end:doctor","no":"mood","coach":{"how":"Ask calmly; allow time for the answer.","say":{"en":"Can I ask more about changes in your energy and how you feel? Take your time.","hi":"क्या हम आपकी एनर्जी में बदलाव और आपको कैसा लग रहा है, इसके बारे में और पूछें? आराम से बताइए।", व और आपको कैसा लग रहा है, इसके बारे में और पूछें? आराम से बताइए।","gu":"શું હું તમારી એનર્જીમાં થયેલા ફેરફાર અને તમને કેવું લાગે છે, તે વિશે વધુ પૂછું? આરામથી કહો."},"page":6,"source_id":"who-mhgap"},"note_yes":"Other changes during the spell.","note_no":"No other changes during the spell reported."},"impact":{"ask":"Has the spell greatly disrupted daily life?","help":"For example, serious trouble at work or admission to hospital.","page":36,"source_id":"who-mhgap","yes":"agitation","no":"end:review","coach":{"how":"Ask calmly; allow time for the answer.","say":{"en":"Can I ask more about changes in your energy and how you feel? Take your time.","hi":"क्या हम आपकी एनर्जी में बदलाव और आपको कैसा लग रहा है, इसके बारे में और पूछें? आराम से बताइए।","gu":"શું હું તમારી એનર્જીમાં થયેલા ફેરફાર અને તમને કેવું લાગે છે, તે વિશે વધુ પૂછું? આરામથી કહો."},"page":6,"source_id":"who-mhgap"},"note_yes":"Marked disruption of daily life.","note_no":"No marked disruption of daily life reported."},"agitation":{"ask":"Is the person acutely agitated now?","help":"For example, pacing and unable to settle; aggression is also asked in the danger stage.","page":36,"source_id":"who-mhgap","yes":"end:doctor","no":"end:mania","coach":{"how":"Ask calmly; allow time for the answer.","say":{"en":"Can I ask more about changes in your energy and how you feel? Take your time.","hi":"क्या हम आपकी एनर्जी में बदलाव और आपको कैसा लग रहा है, इसके बारे में और पूछें? आराम से बताइए।","gu":"શું હું તમારી એનર્જીમાં થયેલા ફેરફાર અને તમને કેવું લાગે છે, તે વિશે વધુ પૂછું? આરામથી કહો."},"page":6,"source_id":"who-mhgap"},"note_yes":"Current acute agitation.","note_no":"No current acute agitation reported."}},"ends":{"doctor":{"kind":"call-doctor","say":"Call the doctor now for an acute physical cause or aggression.","page":36,"source_id":"who-mhgap"},"mania":{"kind":"suggest","say":"This pattern may fit a manic episode. The doctor must confirm it.","page":36,"source_id":"who-mhgap","condition":"psy.bipolar-mania","c screens":[{"id":"phq9","name":"PHQ-9","items":[],"scoring":"Not implemented in v0; use the publisher's current form only after clinical and wording review.","licence":"Pfizer makes the form available; exact items and licence terms must be checked before embedding.","url":"https://www.phqscreeners.com/"},{"id":"gad7","name":"GAD-7","items":[],"scoring":"Not implemented in v0; use the publisher's current form only after clinical and wording review.","licence":"Pfizer makes the form available; exact items and licence terms must be checked before embedding.","url":"https://www.phqscreeners.com/"},{"id":"audit","name":"AUDIT","items":[],"scoring":"Not implemented in v0; use the WHO manual only after clinical and reuse review.","licence":"WHO publication; reuse terms must be checked before embedding.","url":"https://www.who.int/publications-detail-redirect/WHO-MSD-MSB-01.6a"}],"mse":[{"id":"mse.appearance","label":"Appearance and behaviour observed","page":10,"source_id":"who-mhgap","type":"ticks","options":["looks after self","untidy or unwashed","restless","slow to move","poor eye contact","odd behaviour"],"detail":true},{"id":"mse.mood","label":"Mood and feeling shown","page":10,"source_id":"who-mhgap","type":"ticks","options":["calm","sad","worried","irritable","too cheerful","shows little feeling"],"detail":true},{"id":"mse.thought","label":"Main thoughts and concerns","page":10,"source_id":"who-mhgap","type":"ticks","options":["nothing unusual noticed","hopeless","many worries","suspicious of others","strange beliefs held firmly","speech hard to follow"],"detail":true},{"id":"mse.perception","label":"Unusual things heard or seen","page":10,"source_id":"who-mhgap","type":"ticks","options":["nothing noticed","says they hear voices others do not","says they see things others do not","talks or laughs to self","seems to listen to something"],"detail":true},{"id":"mse.cognition","label":"Attention and orientation","page":10,"source_id":"who-mhgap","type":"ticks","options":["knows day, place and person","confused about day or place","poor attention","poor memory"],"detail":true}],"note":{"header":"OPD FIRST HISTORY - DRAFT for the doctor (suggested, not a diagnosis until a doctor confirms)","sections":["Identifying data","Chief complaints","History of present illness","Past psychiatric history","Medical history and current medicines","Substance use","Family history","Personal and social history","Risk","Mental state","Differentials to consider","Management options from mhGAP and NICE/WHO guidelines, for the doctor to decide","Not asked or not answered","Doctor's review"],"doctor_review":"Confirmed / changed: ______  Signature ______  Date ______","body_cause_unknown":"Doctor to rule out body causes","pregnancy_warning":"Pregnant or breastfeeding: doctor to check the mhGAP special-population advice before any medicine option.","plan_none":"Doctor to plan; no mhGAP/NICE route recorded","identity":["{patient}, ","{age}-year-old ","{marital} ","{sex}",", {occupation}",", education: {education}",", from {residence}","."],"identity_after":["History taken by: {role}."],"chief_complaint":["{main_words}",". Duration: {duration}","."]},"unknown_answer":{"allowed":true,"end":"incomplete - doctor to assess","record_in_note":true},"glance":[{"id":"danger.confused","page":35,"source_id":"who-mhgap","yes":"call-doctor-now","codes":{"icd11":[["6D70","Delirium"]],"icd10":[["F05","Delirium, not induced by alcohol and other psychoactive substances"]],"dsm5tr":["Delirium"]},"label":"Very confused or does not know where they are","seen_only":true,"note_yes":"Marked confusion or disorientation observed.","note_no":"No marked confusion or disorientation observed."},{"id":"danger.withdrawal","page":110,"source_id":"who-mhgap","yes":"call-doctor-now","label":"Shaking heavily, sweating heavily, or having a fit","seen_only":true,"note_yes":"Heavy shaking, sweating or a fit observed.","note_no":"No heavy shaking, sweating or fit observed."},{"id":"danger.physical","page":18,"source_id":"checkin-v0","yes":"call-doctor-now","label":"Injury, chest pain, breathing trouble, collapse or suspected overdose","seen_only":true,"note_yes":"An acute physical danger sign observed.","note_no":"No listed acute physical danger sign observed."},{"id":"danger.catatonia","help":"For example, the person suddenly stays motionless and does not answer.","source_id":"bap-catatonia","ref":"Recognition section","yes":"call-doctor-now","no":"continue","codes":{"icd11":[["6A4Z","Catatonia, unspecified"]],"icd10":[],"dsm5tr":["Unspecified catatonia"]},"label":"New stillness, no speech, stuck posture or wild excitement","seen_only":true,"note_yes":"New stillness, mutism, unusual fixed posture or severe excitement observed.","note_no":"No listed new movement or speech danger sign observed."},{"id":"danger.violence","label":"Violent or threatening behaviour now","seen_only":true,"yes":"call-doctor-now","note_yes":"Violent or threatening behaviour observed.","note_no":"No violent or threatening behaviour observed.","source_id":"who-mhgap","page":17}],"ask_danger":[{"id":"danger.self-harm","ask":"Have you recently thought about ending your life or hurting yourself?","yes":"call-doctor-now","no":"continue","note_yes":"Recent thoughts of ending life or self-harm.","note_no":"No recent thoughts of ending life or self-harm reported.","coach":{"how":"Warn first, normalise, then ask directly; asking does not put the idea in their head.","say":{"en":"I ask everyone this. Many people in pain have such thoughts. Have you thought about ending your life or hurting yourself?","hi":"हम यह सवाल सबसे पूछते हैं। तकलीफ़ में कई लोगों को ऐसे विचार आते हैं। क्या आपने अपनी जान लेने या खुद को चोट पहुँचाने की सोची है?","gu":"હું આ સવાલ દરેકને પૂછું છું. તકલીફમાં ઘણા લોકોને આવા વિચારો આવે છે. શું તમે પોતાનો જીવ લેવાનો કે પોતાને ઈજા પહોંચાડવાનો વિચાર કર્યો છે?"},"page":138,"source_id":"who-mhgap"},"page":134,"source_id":"who-mhgap"},{"id":"danger.self-harm-plan","ask":"Do you have a plan or anything you might use to hurt yourself?","yes":"call-doctor-now","no":"continue","note_yes":"A current self-harm plan or access to a means.","note_no":"No current self-harm plan or access to a means.","coach":{"how":"Ask plainly about a plan and available means; stay calm.","say":{"en":"Have you thought about how you might do it? Do you have anything you could use now?","hi":"क्या आपने सोचा है कि आप यह कैसे करेंगे? क्या अभी आपके पास कोई ऐसी चीज़ है जिसका आप इस्तेमाल कर सकते हैं?","gu":"શું તમે વિચાર્યું છે કે તમે આ કેવી રીતે કરશો? શું અત્યારે તમારી પાસે એવી કોઈ વસ્તુ છે જે તમે વાપરી શકો?"},"page":134,"source_id":"who-mhgap"},"page":134,"source_id":"who-mhgap"},{"id":"danger.harm-others","ask":"Have you recently thought about hurting someone else?","yes":"call-doctor-now","no":"continue","note_yes":"Recent thoughts of harming another person.","note_no":"No recent thoughts of harming another person reported.","coach":{"how":"Warn before the sensitive question; ask without judgment.","say":{"en":"I ask everyone about safety. Have you thought about hurting someone else?","hi":"हम सबसे सुरक्षा के बारे में पूछते हैं। क्या आपने किसी और को चोट पहुँचाने की सोची है?","gu":"હું દરેકને સલામતી વિશે પૂછું છું. શું તમે બીજા કોઈને ઈજા પહોંચાડવાનું વિચાર્યું છે?"},"page":6,"source_id":"who-mhgap"},"page":45,"source_id":"who-mhgap"}],"tips":[{"say":{"en":"Say who you are. Tell the person why you are asking questions.","hi":"अपना नाम और काम बताइए। व्यक्ति को बताइए कि आप सवाल क्यों पूछ रहे हैं।","gu":"તમારું નામ અને કામ કહો. તમે સવાલ કેમ પૂછો છો તે વ્યક્તિને કહો."},"page":6,"source_id":"who-mhgap"},{"say":{"en":"Find a place where others cannot hear. Explain when you must tell the doctor for safety.","hi":"ऐसी जगह ढूँढिए जहाँ दूसरे लोग सुन न सकें। बताइए कि सुरक्षा के लिए आपको डॉक्टर को कब बताना होगा।","gu":"એવી જગ્યા શોધો જ્યાં બીજા લોકો સાંભળી ન શકે. સલામતી માટે ડૉક્ટરને ક્યારે કહેવું પડશે તે સમજાવો."},"page":6,"source_id":"who-mhgap"},{"say":{"en":"Let the person tell you what happened. Then ask specific questions.","hi":"पहले व्यक्ति को बताने दीजिए कि क्या हुआ। फिर खास सवाल पूछिए।","gu":"પહેલા વ્યક્તિને શું થયું તે કહેવા દો. પછી ચોક્કસ સવાલ પૂછો."},"page":6,"source_id":"who-mhgap"},{"say":{"en":"Use simple words. Give the person time to stay quiet.","hi":"आसान शब्द इस्तेमाल कीजिए। व्यक्ति को कुछ देर चुप रहने का समय दीजिए।","gu":"સાદા શબ્દો વાપરો. વ્યક્તિને થોડી વાર ચૂપ રહેવાનો સમય આપો."},"page":6,"source_id":"who-mhgap"},{"say":{"en":"Tell the person before you ask about private things. Ask kindly and clearly.","hi":"निजी बातें पूछने से पहले व्यक्ति को बताइए। नरमी से और साफ़ पूछिए।","gu":"અંગત વાતો પૂછતા પહેલાં વ્યક્તિને કહો. નરમાઈથી અને સ્પષ્ટ રીતે પૂછો."},"page":6,"source_id":"who-mhgap"},{"say":{"en":"Stay calm. Say back what you heard. Do not judge the person.","hi":"शांत रहिए। आपने जो सुना, उसे अपने शब्दों में दोहराइए। व्यक्ति के बारे में राय मत बनाइए।","gu":"શાંત રહો. તમે જે સાંભળ્યું તે તમારા શબ્દોમાં પાછું કહો. વ્યક્તિ વિશે ચુકાદો ન આપો."},"page":6,"source_id":"who-mhgap"},{"say":{"en":"Briefly repeat what the person told you. Thank them.","hi":"व्यक्ति ने जो बताया, उसे थोड़े शब्दों में दोहराइए। उनका शुक्रिया अदा कीजिए।","gu":"વ્યક્તિએ જે કહ્યું તે ટૂંકમાં ફરી કહો. તેમનો આભાર માનો."},"page":6,"source_id":"who-mhgap"}]};</script>
  <script>window.MEASURES_LIBRARY = {"version":"0","use":"proposal for history-flow lead; no flow wiring or patient use","measures":[{"id":"phq9","name":"PHQ-9","holder":"Pfizer; developed by Robert L. Spitzer, Janet B.W. Williams, Kurt Kroenke and colleagues","credit_line":"PHQ-9; Spitzer, Williams, Kroenke and colleagues; Pfizer.","licence":{"quote":"in the public domain","url":"https://www.phqscreeners.com/images/sites/g/files/g10016261/f/201412/instructions.pdf"},"scoring":{"method":"sum the nine 0-3 responses; 0-27; clinician reviews the result, including item 9 separately","range":[0,27],"bands":[{"min":0,"max":4,"label":"minimal"},{"min":5,"max":9,"label":"mild"},{"min":10,"max":14,"label":"moderate"},{"min":15,"max":19,"label":"moderately severe"},{"min":20,"max":27,"label":"severe"}],"source_url":"https://www.phqscreeners.com/images/sites/g/files/g10016261/f/201412/instructions.pdf"},"short_form":{"name":"PHQ-2","item_ids":["phq9_1","phq9_2"],"method":"sum first two 0-3 responses","cutoff":3,"meaning":"prompts full PHQ-9 and clinical interview","source_url":"https://www.phqscreeners.com/images/sites/g/files/g10016261/f/201412/instructions.pdf"},"danger_items":[{"item_id":"phq9_9","codes":[1,2,3],"action":"doctor-call","source_url":"https://www.phqscreeners.com/images/sites/g/files/g10016261/f/201412/instructions.pdf"}],"offer_when":{"text":"Offer after the history suggests low mood or loss of interest; use the result to guide a clinical interview.","source_url":"https://www.phqscreeners.com/images/sites/g/files/g10016261/f/201412/instructions.pdf"},"offer_at":[{"flow":"dep.depression","question":"low_mood","answer":"yes"},{"flow":"dep.depression","question":"lost_interest","answer":"yes"}],"source_url":"https://www.phqscreeners.com/images/sites/g/files/g10060481/f/201412/PHQ-9_English.pdf","translation":{"hi":{"status":"official","source_url":"https://www.phqscreeners.com/images/sites/g/files/g10060481/f/201412/PHQ9_Hindi%20for%20India.pdf"},"gu":{"status":"official","source_url":"https://www.phqscreeners.com/images/sites/g/files/g10060481/f/201412/PHQ9_Gujarati%20for%20India.pdf"}},"timeframe_stem":{"en":"Over the last 2 weeks, how often have you been bothered by any of the following problems?","hi":"पिछले 2 सप्ताहों में, आप इन समस्याओं में से किसी से भी कितनी बार परेशान रहे/रही हैं?","gu":"છેલ્લા બે અઠવાડિયામાં તમને નીચેની કોઈ પણ સમસ્યાનો કેટલી વાર અનુભવ થયો છે?"},"response_options":[{"code":0,"text":{"en":"Not at all","hi":"बिल्कुल नहीं","gu":"જરા પણ નહીં"}},{"code":1,"text":{"en":"Several days","hi":"कई दिन","gu":"કેટલાય દિવસો"}},{"code":2,"text":{"en":"More than half the days","hi":"आधे से अधिक दिन","gu":"અડધાથી વધારે દિવસોમાં"}},{"code":3,"text":{"en":"Nearly every day","hi":"लगभग हर दिन","gu":"લગભગ રોજ"}}],"items":[{"id":"phq9_1","text":{"en":"Little interest or pleasure in doing things","hi":"कुछ करने में बहुत कम दिलचस्पी या मज़ा आना","gu":"પ્રવૃત્તિ કરવામાં ઓછો રસ અથવા ઓછો આનંદ"},"simple":{"en":"Have you had little interest or joy in doing things?","hi":"क्या आपको कुछ भी करने में पहले से कम दिलचस्पी या खुशी मिली है?","gu":"શું તમને કંઈ પણ કરવામાં પહેલાં કરતાં ઓછો રસ કે આનંદ આવ્યો છે?"}},{"id":"phq9_2","text":{"en":"Feeling down, depressed, or hopeless","hi":"उदास, अवसादग्रस्त या निराश महसूस करना","gu":"હતાશા, ઉદાસી અથવા નિરાશા લાગવી"},"simple":{"en":"Have you felt sad, very low, or without hope?","hi":"क्या आपका मन उदास रहा है, या आपको कोई उम्मीद नहीं लगी?","gu":"શું તમારું મન ઉદાસ રહ્યું છે, અથવા તમને કોઈ આશા નથી લાગી?"}},{"id":"phq9_3","text":{"en":"Trouble falling or staying asleep, or sleeping too much","hi":"नींद आने या सोये रहने में परेशानी, या फिर बहुत अधिक सोना","gu":"ઊંઘ ન આવવી, વચ્ચે ઊંઘ ઊડી જવી, વધારે ઊંઘ આવવી"},"simple":{"en":"Have you had trouble falling asleep or staying asleep? Have you slept too much?","hi":"क्या आपको नींद आने या नींद में बने रहने में परेशानी हुई? क्या आप बहुत ज़्यादा सोए?","gu":"શું તમને ઊંઘ આવવામાં કે ઊંઘ ચાલુ રાખવામાં તકલીફ થઈ? શું તમે બહુ વધારે ઊંઘ્યા?"}},{"id":"phq9_4","text":{"en":"Feeling tired or having little energy","hi":"थकान महसूस करना या बहुत कम ऊर्जा होना","gu":"થાક અથવા અશક્તિ લાગવી"},"simple":{"en":"Have you felt tired or had little energy?","hi":"क्या आपको थकान हुई है या आपकी एनर्जी कम रही है?","gu":"શું તમને થાક લાગ્યો છે કે તમારી એનર્જી ઓછી રહી છે?"}},{"id":"phq9_5","text":{"en":"Poor appetite or overeating","hi":"भूख कम लगना या ज़्यादा खाना","gu":"ભૂખ ઓછી કે વધારે લાગવી"},"simple":{"en":"Have you had little appetite or eaten too much?","hi":"क्या आपको भूख कम लगी या आपने बहुत ज़्यादा खाया?","gu":"શું તમને ભૂખ ઓછી લાગી કે તમે બહુ વધારે ખાધું?"}},{"id":"phq9_6","text":{"en":"Feeling bad about yourself -- or that you are a failure or have let yourself or your family down","hi":"अपने बारे में बुरा महसूस करना - या ऐसा महसूस करना कि आप नाकाम इंसान हैं और आपने खुद को और अपने परिवार को नीचा दिखाया है","gu":"તમને તમારા વિષે ખરાબ લાગે અથવા તમે નિષ્ફળ ગયા છો અથવા તમે તમારી અથવા તમારા સ્વજનોની અપેક્ષા સંતોષી નથી"},"simple":{"en":"Have you felt bad about yourself? Have you felt you failed yourself or your family?","hi":"क्या आपको अपने बारे में बुरा लगा है? क्या आपको लगा कि आप नाकाम रहे, या आपने खुद को या अपने परिवार को निराश किया है?","gu":"શું તમને તમારા વિશે ખરાબ લાગ્યું છે? શું તમને લાગ્યું કે તમે નિષ્ફળ ગયા છો, અથવા તમે પોતાને કે પરિવારને નિરાશ કર્યા છે?"}},{"id":"phq9_7","text":{"en":"Trouble concentrating on things, such as reading the newspaper or watching television","hi":"अखबार पढ़ने या टेलीविज़न देखने जैसी चीज़ों पर ध्यान देने में परेशानी","gu":"છાપાં વાંચવા અથવા ટી.વી. જોવા બાબતોમાં એકધ્યાન રહેવામાં તકલીફ"},"simple":{"en":"Have you had trouble keeping your mind on things, like reading or watching TV?","hi":"क्या आपको ध्यान लगाने में परेशानी हुई, जैसे पढ़ते या टीवी देखते समय?","gu":"શું તમને ધ્યાન રાખવામાં તકલીફ થઈ, જેમ કે વાંચતા કે ટીવી જોતા?"}},{"id":"phq9_8","text":{"en":"Moving or speaking so slowly that other people could have noticed? Or the opposite -- being so fidgety or restless that you have been moving around a lot more than usual","hi":"इतना धीमे चलना-फिरना या बोलना कि लोगों का ध्यान जाये? या इसका उल्टा - इतना अस्थिर या बेचैन होना कि आप सामान्य से काफ़ी ज़्यादा हिलते-डुलते और चलते-फिरते रहे हैं","gu":"હલનચલન અથવા બોલવાનું એટલું ધીમું હોય કે બીજા લોકોનું ધ્યાન જાય? અથવા એનાથી ઉલટું, એટલો બધો રઘવાટ અથવા અસ્વસ્થતા કે તમે રાબેતા કરતાં વધારે ઝડપથી આમતેમ ફરો"},"simple":{"en":"Have you moved or spoken so slowly that others noticed? Or have you been so restless that you moved much more than usual?","hi":"क्या आप इतने धीरे हिले-डुले या बोले कि दूसरों ने ध्यान दिया? या क्या आप इतने बेचैन रहे कि आम दिनों से बहुत ज़्यादा हिले-डुले?","gu":"શું તમારું હલનચલન કે બોલવાનું એટલું ધીમું થયું કે બીજાને ધ્યાનમાં આવ્યું? અથવા તમે એટલા બેચેન રહ્યા કે સામાન્ય કરતાં ઘણું વધારે હલનચલન કર્યું?"}},{"id":"phq9_9","text":{"en":"Thoughts that you would be better off dead or of hurting yourself in some way","hi":"ऐसे विचार कि आप मर जाते तो अच्छा होता या किसी ढंग से खुद को नुकसान पहुँचाना","gu":"આના કરતાં મરવાનો અથવા તમને પોતાને કોઈક રીતે ઈજા કરવાનો વિચાર આવે"},"simple":{"en":"Have you thought you would be better off dead? Have you thought of hurting yourself?","hi":"क्या आपको लगा कि आपका मर जाना बेहतर होगा? क्या आपने खुद को चोट पहुँचाने के बारे में सोचा?","gu":"શું તમને લાગ્યું કે તમે મરી જાઓ તો સારું? શું તમે પોતાને ઈજા પહોંચાડવાનું વિચાર્યું?"}}]},{"id":"gad7","name":"GAD-7","holder":"Pfizer; developed by Robert L. Spitzer, Janet B.W. Williams, Kurt Kroenke and colleagues","credit_line":"GAD-7; Spitzer, Williams, Kroenke and colleagues; Pfizer.","licence":{"quote":"in the public domain","url":"https://www.phqscreeners.com/images/sites/g/files/g10016261/f/201412/instructions.pdf"},"scoring":{"method":"sum the seven 0-3 responses; 0-21; clinician reviews the result","range":[0,21],"bands":[{"min":0,"max":4,"label":"minimal"},{"min":5,"max":9,"label":"mild"},{"min":10,"max":14,"label":"moderate"},{"min":15,"max":21,"label":"severe"}],"source_url":"https://www.phqscreeners.com/images/sites/g/files/g10016
