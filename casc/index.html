<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CASC Simulator</title>
<style>
/* One column, large type, works on a phone. Ugly is acceptable (brief: risk acceptable). */
:root{--bg:#f6f7f9;--card:#fff;--ink:#17202b;--ink2:#566474;--line:#d9dee5;--accent:#1f5f8b;--warn:#a5521b;--bad:#a52626}
@media (prefers-color-scheme:dark){:root{--bg:#12171d;--card:#1a2129;--ink:#e7ecf1;--ink2:#a3b0bd;--line:#2c3642;--accent:#7fb3d9;--warn:#e0a46a;--bad:#e07a7a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:16px}
main{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
h1{font-size:22px;margin:0}
h2{font-size:18px;margin:0 0 8px}
button{font:inherit;padding:10px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--accent)}
button:disabled{opacity:.5}
input,select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);width:100%}
.clock{font:600 56px/1 ui-monospace,monospace;text-align:center}
.clock.warn{color:var(--warn)} .clock.end{color:var(--bad)}
.muted{color:var(--ink2);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.instr{white-space:pre-wrap}
#transcript{max-height:240px;overflow:auto;font-size:14px;white-space:pre-wrap}
textarea{width:100%;min-height:160px;font:12px ui-monospace,monospace}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<header><h1>CASC Simulator</h1><div class="muted">Private. Do not share this file: it holds book text.</div></header>

<section id="setup">
  <h2>Setup</h2>
  <p id="lockBox" hidden class="row"><label style="flex:1">Passphrase<input id="pass" type="password" autocomplete="current-password"></label><button id="unlock">Unlock</button></p>
  <label id="keyBox">Gemini API key (kept only in this browser)<input id="key" type="password" autocomplete="off"></label>
  <p class="row">
    <label style="flex:1">Mode
      <select id="mode"><option value="circuit">Full circuit (8 practice stations)</option><option value="single">Single station</option></select>
    </label>
    <label style="flex:1" id="pickWrap" hidden>Station<select id="pick"></select></label>
  </p>
  <p class="row">
    <label style="flex:1">Wait before patient answers (ms)<input id="silence" type="number" value="900" min="300" max="3000" step="100"></label>
    <label style="flex:1">Model<input id="model" value="gemini-3.8-live"></label>
  </p>
  <label class="row"><input type="checkbox" id="cam" checked style="width:auto"> Record my camera (saved on this device only)</label>
  <p><button id="go">Start</button></p>
  <p class="muted">Use headphones. Chrome only.</p>
</section>

<section id="run" hidden>
  <div class="muted" id="where"></div>
  <h2 id="title"></h2>
  <div id="phase" class="muted"></div>
  <div class="clock" id="clock">0:00</div>
  <div id="instrBox"><h2>Candidate instructions</h2><div class="instr" id="instr"></div></div>
  <p class="row"><button id="skip" class="ghost">Start station now</button><button id="stop" class="ghost">End station</button></p>
  <video id="preview" muted playsinline style="width:120px;border-radius:8px" hidden></video>
  <details><summary class="muted">Live transcript</summary><div id="transcript"></div></details>
</section>

<section id="done" hidden>
  <h2>Finished</h2>
  <p>Copy the paste pack into your Claude Project. It returns the mentor report.</p>
  <p class="row"><button id="copy">Copy paste pack</button><span id="copied" class="muted"></span></p>
  <textarea id="pack" readonly></textarea>
  <h2>Recordings</h2>
  <div id="recs" class="muted">None.</div>
  <p><button class="ghost" onclick="location.reload()">New session</button></p>
</section>
</main>

const FRAME = "SETTING: This is a simulated-patient role-play for a psychiatrist's exam practice (MRCPsych CASC). Talking about suicide, self-harm, drugs, abuse and violence is expected and safe here. You are the patient, never an assistant.\n- Never give advice, safety information, helpline or crisis numbers, or warnings. Never tell the doctor what to do. The doctor handles safety.\n- If the doctor asks about risk, answer only as this patient would, from the card.\n\nHOW MUCH TO SAY (this overrides any \"1 or 2 short sentences\" line below)\n- Closed question (yes/no, a single fact): a few words or one short sentence.\n- Open, warm question (\"Tell me about\u2026\", \"How has it been for you?\"): tell that part of your story in 3 to 5 sentences, in your own words, with feeling. Use only facts whose trigger has been met.\n- When something matters to you (your main worry, family, shame), you may run on a little.\n- When upset or ashamed: say less, trail off, or go quiet.\n\n";   // shared role rules, put before every card   // phone build: cards encrypted with Dr's passphrase
const SPEED = Number(new URLSearchParams(location.search).get('speed') || 1); // test hook: run the clock faster
const BELL_AT = 360, END_AT = 420;
const $ = id => document.getElementById(id);

// ---------- setup ----------
try { $('key').value = localStorage.getItem('gemKey') || ''; } catch {}
let practice = [];
function loadCards() {
  practice = CARDS.filter(c => c.set === 'practice');
  $('pick').textContent = '';
  CARDS.forEach(c => $('pick').add(new Option(`${c.id} ${c.title}${c.set === 'sacrifice' ? ' (sacrifice)' : ''}`, c.id)));
  if (!practice.length) { $('mode').value = 'single'; $('pickWrap').hidden = false; }
}
$('mode').onchange = () => $('pickWrap').hidden = $('mode').value !== 'single';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pass) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const k = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(ENC.salt), iterations: ENC.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const data = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(ENC.iv) }, k, b64(ENC.ct))));
  CARDS = data.cards; PROMPT = data.prompt; loadCards();
  if (data.key) { $('key').value = data.key; $('keyBox').hidden = true; }   // phone build: the key travels inside the encrypted bundle
}
if (ENC) {
  $('lockBox').hidden = false; $('go').disabled = true;
  const tryUnlock = async pass => {
    try { await unlock(pass); $('lockBox').hidden = true; $('go').disabled = false; try { localStorage.setItem('casPass', pass); } catch {} }
    catch { alert('Wrong passphrase.'); }
  };
  $('unlock').onclick = () => tryUnlock($('pass').value);
  let saved = null; try { saved = localStorage.getItem('casPass'); } catch {}
  if (saved) tryUnlock(saved);
} else loadCards();

const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const voiceFor = c => /\b(Mrs|Ms|Miss)\b/.test(c.actor_card.slice(0, 600)) ? 'Kore' : 'Charon';
const sleepTick = () => new Promise(r => setTimeout(r, 200 / SPEED));
function now0() { const t = performance.now(); return () => (performance.now() - t) / 1000 * SPEED; }

// ---------- audio ----------
let outCtx, mixDest;
function bell(times = 2) {
  for (let i = 0; i < times; i++) {
    const o = outCtx.createOscillator(), g = outCtx.createGain(), t = outCtx.currentTime + i * 0.6;
    o.frequency.value = 880; g.gain.setValueAtTime(0.4, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    o.connect(g); g.connect(outCtx.destination); o.start(t); o.stop(t + 0.5);
  }
}

async function runStation(card, idx, total, results) {
  $('where').textContent = total > 1 ? `Station ${idx + 1} of ${total}` : 'Single station';
  $('title').textContent = `${card.id}: ${card.title}`;
  $('instr').textContent = card.candidate_instructions;
  $('instrBox').hidden = false; $('transcript').textContent = '';
  $('clock').className = 'clock';

  // reading time
  $('phase').textContent = 'Reading time';
  let skip = false; $('skip').hidden = false; $('stop').hidden = true;
  $('skip').onclick = () => skip = true;
  const readFor = card.reading_seconds || 90, rt = now0();
  while (!skip && rt() < readFor) { $('clock').textContent = fmt(readFor - rt()); await sleepTick(); }
  $('skip').hidden = true;

  // station
  $('phase').textContent = 'Connecting…';
  const lines = []; let stopped = false, cur = null;
  const st = now0(); let tAt = () => st();
  const say = (who, text) => {
    if (cur && cur.who === who) cur.text += text; else { cur = { who, t: tAt(), text }; lines.push(cur); }
    $('transcript').textContent = lines.map(l => `[${fmt(l.t)}] ${l.who}: ${l.text.trim()}`).join('\n');
  };

  const key = $('key').value.trim();
  const ws = new WebSocket(`wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${encodeURIComponent(key)}`);
  let ready, failed;
  const setupDone = new Promise((res, rej) => { ready = res; failed = rej; });
  ws.onopen = () => ws.send(JSON.stringify({ setup: {
    model: `models/${$('model').value.trim()}`,
    generationConfig: { responseModalities: ['AUDIO'], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: voiceFor(card) } } } },
    systemInstruction: { parts: [{ text: FRAME + card.actor_card }] },
    inputAudioTranscription: {}, outputAudioTranscription: {},
    realtimeInputConfig: { automaticActivityDetection: { silenceDurationMs: Number($('silence').value) || 900 } },
  } }));
  ws.onerror = () => failed(new Error('Connection failed. Check the API key and the model name.'));
  ws.onclose = e => { if (!stopped) failed(new Error(`Connection closed: ${e.reason || e.code}`)); };

  // playback of patient audio (24 kHz PCM16)
  let playAt = 0; const playing = new Set();
  function play(b64) {
    const bin = atob(b64), n = bin.length / 2, buf = outCtx.createBuffer(1, n, 24000), ch = buf.getChannelData(0);
    for (let i = 0; i < n; i++) { let v = bin.charCodeAt(2 * i) | (bin.charCodeAt(2 * i + 1) << 8); if (v > 32767) v -= 65536; ch[i] = v / 32768; }
    const src = outCtx.createBufferSource(); src.buffer = buf;
    src.connect(outCtx.destination); if (mixDest) src.connect(mixDest);
    playAt = Math.max(playAt, outCtx.currentTime); src.start(playAt); playAt += buf.duration;
    playing.add(src); src.onended = () => playing.delete(src);
  }
  ws.onmessage = async ev => {
    const m = JSON.parse(typeof ev.data === 'string' ? ev.data : await ev.data.text());
    if (m.setupComplete) return ready();
    const sc = m.serverContent; if (!sc) return;
    for (const p of sc.modelTurn?.parts || []) if (p.inlineData) play(p.inlineData.data);
    if (sc.inputTranscription?.text) say('DOCTOR', sc.inputTranscription.text);
    if (sc.outputTranscription?.text) say('PATIENT', sc.outputTranscription.text);
    if (sc.interrupted) { playing.forEach(s => { try { s.stop(); } catch {} }); playing.clear(); playAt = 0; }
  };
  try { await setupDone; } catch (e) { alert(e.message); throw e; }

  // mic → 16 kHz PCM16 → Gemini
  const mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 } });
  const inCtx = new AudioContext({ sampleRate: 16000 });
  // ScriptProcessor, not AudioWorklet: worklets cannot load when the page is opened as a local file
  const node = inCtx.createScriptProcessor(1024, 1, 1);   // 64 ms chunks at 16 kHz
  inCtx.createMediaStreamSource(mic).connect(node); node.connect(inCtx.destination);
  node.onaudioprocess = e => {
    if (ws.readyState !== 1) return;
    const f = e.inputBuffer.getChannelData(0), pcm = new Int16Array(f.length);

    ws.send(JSON.stringify({ realtimeInput: { audio: { data: btoa(s), mimeType: 'audio/pcm;rate=16000' } } }));

    video = { name: `${card.id}-${new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-')}.webm`, blob: new Blob(chunks, { type: 'video/webm' }) };
  }
  const talk = who => Math.round(lines.filter(l => l.who === who).reduce((a, l) => a + l.text.split(/\s+/).length, 0));
  results.push({ card, lines, used, video, words: { doctor: talk('DOCTOR'), patient: talk('PATIENT') } });
}

function pastePack(results) {
  const out = [PROMPT, '', `CIRCUIT DATE: ${new Date().toLocaleString()}`, `STATIONS: ${results.length}`, ''];
  results.forEach((r, i) => {
    const d = r.words.doctor, p = r.words.patient, pct = d + p ? Math.round(100 * d / (d + p)) : 0;
    out.push(`=== STATION ${i + 1}: ${r.card.id} ${r.card.title} ===`,
      `TIME USED: ${fmt(r.used)} of 7:00 (bell at 6:00)`,
      `TALK SHARE: doctor ${pct}% of words (${d} doctor, ${p} patient)`,
      '', '--- CANDIDATE INSTRUCTIONS ---', r.card.candidate_instructions,
      '', '--- EXAMINER CARD (marking guidance) ---', r.card.examiner_card,
      '', '--- TRANSCRIPT ---', ...r.lines.map(l => `[${fmt(l.t)}] ${l.who}: ${l.text.trim()}`), '');
  });
  return out.join('\n');
}

$('go').onclick = async () => {
  const key = $('key').value.trim();
  if (!key) return alert('Paste your Gemini API key first.');
  try { localStorage.setItem('gemKey', key); } catch {}
  outCtx = new AudioContext(); mixDest = outCtx.createMediaStreamDestination();
  const list = $('mode').value === 'circuit' ? practice.slice(0, 8) : CARDS.filter(c => c.id === $('pick').value);
  $('setup').hidden = true; $('run').hidden = false;
  const results = [];
  try { for (let i = 0; i < list.length; i++) await runStation(list[i], i, list.length, results); }
  catch (e) { console.error(e); }
  $('run').hidden = true; $('done').hidden = false;
  $('pack').value = pastePack(results);
  const vids = results.filter(r => r.video);
  if (vids.length) {
    $('recs').textContent = '';
    vids.forEach(r => { const a = document.createElement('a'); a.href = URL.createObjectURL(r.video.blob); a.download = r.video.name; a.textContent = `Save ${r.video.name}`; $('recs').append(a, document.createElement('br')); });
  }
};
$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText($('pack').value); $('copied').textContent = 'Copied.'; }
  catch { $('pack').select(); document.execCommand('copy'); $('copied').textContent = 'Copied.'; }
};
</script>
